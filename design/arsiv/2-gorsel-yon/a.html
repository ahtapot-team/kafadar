  </div>

<figure><div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 20px 36px; background: #0E0B1A; color: #F6F3FF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; justify-content: space-between; align-items: center">

    <div style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 31px; line-height: 1.18; letter-spacing: -0.02em">Doğum gününü unutup “sürprizin yarın” demek.</div>
    <div style="font-size: 15px; font-weight: 600; color: #5B4E8C">OK mu, NOK mu?</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
    <div style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 132px; line-height: 1; color: #9B7BFF">2</div>
    <div style="display: flex; gap: 8px">
      <div style="width: 36px; height: 8px; border-radius: 99px; background: #9B7BFF"></div>
      <div style="width: 36px; height: 8px; border-radius: 99px; background: #9B7BFF"></div>
      <div style="width: 36px; height: 8px; border-radius: 99px; background: #241B45"></div>
    </div>
    <div style="font-size: 17px; font-weight: 600; color: #A99FD1">Başparmaklar hazır!</div>

</div></figure>
<figure><div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 20px 36px; background: #0E0B1A; color: #F6F3FF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; align-items: center; gap: 8px; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 18px; color: #FF4D5E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(180deg)"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>NOK
