<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — paylaşım görseli</title>
<!-- 1080×1920 (9:16) sonuç görseli, KK-13. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --kontur: #0B0920; --golge: #7C6CFF;
    --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .gorsel { width: 1080px; height: 1920px; margin: 0 auto; background: var(--zemin); color: var(--metin); padding: 120px 90px 100px;
    display: flex; flex-direction: column; gap: 52px; position: relative; overflow: hidden; }
  .sticker { display: inline-block; transform: rotate(-4deg); border: 10px solid var(--kontur); border-radius: 44px; box-shadow: 14px 14px 0 var(--golge);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); }
  .kart { background: var(--marka); color: var(--kontur); border: 10px solid var(--kontur); border-radius: 70px; box-shadow: 20px 20px 0 var(--golge);
    padding: 70px 64px; transform: rotate(-3deg); }
  .satir { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 60px; }
  .cubuk { height: 100px; border-radius: 44px; border: 10px solid var(--kontur); background: var(--yuzey); overflow: hidden; }
  .cubuk i { display: block; height: 100%; border-right: 10px solid var(--kontur); }
  .bas { width: 60px; height: 60px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bas" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></g></symbol>
</svg>
<div class="gorsel">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span class="sticker" style="background: var(--marka); font-size: 96px; padding: 16px 44px 26px">Kafadar!</span>
    <span style="font-size: 44px; font-weight: 800; color: var(--soluk)">OK mu NOK mu?</span>
  </div>

  <div class="kart">
    <div style="font-size: 36px; font-weight: 800; letter-spacing: 0.08em">DURUM</div>
    <div style="margin-top: 30px; font-size: 84px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.06">Doğum gününü unutup “sürprizin yarın” demek.</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 26px; margin-top: 20px">
    <span class="sticker" style="background: var(--nok); font-size: 130px; padding: 14px 44px 26px">Ayşe</span>
    <div style="font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">tek başına <span style="color: var(--nok)">NOK!</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px">
    <div class="satir" style="color: var(--ok)"><span style="display: flex; gap: 20px; align-items: center"><svg class="bas"><use href="#bas"/></svg>OK</span><span>4</span></div>
    <div class="cubuk"><i style="width: 80%; background: var(--ok)"></i></div>
    <div class="satir" style="color: var(--nok); margin-top: 20px"><span style="display: flex; gap: 20px; align-items: center"><svg class="bas" style="transform: rotate(180deg)"><use href="#bas"/></svg>NOK</span><span>1</span></div>
    <div class="cubuk"><i style="width: 20%; background: var(--nok)"></i></div>
  </div>

  <div style="margin-top: auto; text-align: center; font-size: 40px; font-weight: 700; color: var(--soluk)">Kafadar ile oynandı · 5 kişi · Arkadaş destesi</div>
</div>
</body>
</html>
