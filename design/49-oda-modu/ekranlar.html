<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — oda modu ekranları</title>
<!-- #49. Çıkartma kiti (design/TASARIM-SISTEMI.md). Kullanım: ?tema=koyu|acik&boy=390x844|375x667. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; --w: 390px; --h: 844px; }
  [data-tema="koyu"] { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --ok-metin: #3DDC84; --nok-metin: #FF5A4E; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; --ok-metin: #0F8A4B; --nok-metin: #D63A2F; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 14px; padding: calc(var(--h) * 0.06) 22px 26px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .esnek { flex: 1; min-height: 0; }
  .orta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ikon-dg { width: 48px; height: 48px; flex: none; border-radius: 16px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); display: grid; place-items: center; }
  .dg { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 62px; border-radius: 20px; border: 4px solid var(--kontur);
    background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font: 800 20px 'Bricolage Grotesque', sans-serif; }
  .dg.ikincil { background: var(--yuzey); color: var(--metin); }
  .baslik { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .etiket { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); }
  .govde { font-size: 16px; font-weight: 500; line-height: 1.45; color: var(--soluk); margin: 0; }
  .sticker { display: inline-block; transform: rotate(-4deg); padding: 4px 16px 8px; border-radius: 16px; border: 4px solid var(--kontur);
    box-shadow: 5px 5px 0 var(--golge); font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); }
  .cip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px; border: 3px solid var(--kontur); font-weight: 800; font-size: 15px; background: var(--yuzey); color: var(--metin); }
  .oda { background: var(--marka-2); color: var(--kontur); transform: rotate(2deg); }
  .kart { padding: 22px 20px; border-radius: 30px; border: 4px solid var(--kontur); background: var(--marka); color: var(--kontur); box-shadow: 8px 8px 0 var(--golge); }
  .secim { padding: 16px 18px; border-radius: 22px; border: 4px solid var(--kontur); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .kutular { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kutular > div { height: 72px; border-radius: 18px; border: 4px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-size: 40px; font-weight: 800; }
  .kutular.dev > div { height: 84px; background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font-size: 50px; }
  .girdi { height: 56px; border-radius: 18px; border: 3px solid var(--kontur); background: var(--yuzey); display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 600; }
  .hata { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 3px solid var(--kontur); background: var(--yuzey); font-weight: 700; font-size: 15px; }
  .hata b { color: var(--nok-metin); }
  .liste { display: flex; flex-wrap: wrap; gap: 8px; }
  .oy-dg { flex: 1; height: 150px; border-radius: 28px; border: 4px solid var(--kontur); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 30px; font-weight: 800; background: var(--yuzey); color: var(--metin); }
  .oy-dg.ok { background: var(--ok); color: var(--kontur); box-shadow: 6px 6px 0 var(--golge); transform: rotate(-2deg); }
  .oy-dg.nok-soluk { color: var(--nok-metin); }
  .oy-dg.ok-soluk { color: var(--ok-metin); }
  .halka { position: relative; width: 64px; height: 64px; display: grid; place-items: center; font-weight: 800; font-size: 24px; }
  .halka svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .perde { position: absolute; inset: 0; background: rgba(11,9,32,.72); display: flex; align-items: flex-end; padding: 22px; }
  .tik { width: 22px; height: 22px; border-radius: 50%; background: var(--marka); border: 2px solid var(--kontur); display: inline-grid; place-items: center; color: var(--kontur); font-size: 13px; font-weight: 800; }
  .bekliyor { opacity: .55; border-style: dashed; }
  .matris { display: grid; grid-template-columns: 74px repeat(10, minmax(0, 1fr)); gap: 4px; align-items: center; font-size: 13px; font-weight: 800; }
  .matris i { aspect-ratio: 1; border-radius: 6px; border: 2px solid var(--kontur); }
  .matris .o { background: var(--ok); } .matris .n { background: var(--nok); } .matris .b { background: var(--yuzey); }
</style>
</head>

  <symbol id="geri" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="kapat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g></symbol>

  <symbol id="wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></g></symbol>

        <div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap">
          <span class="cip" style="background: var(--marka-2); color: var(--kontur)">Ruh ikizin: Deniz</span>
          <span class="cip" style="background: var(--ok); color: var(--kontur)">6 OK</span><span class="cip" style="background: var(--nok); color: var(--kontur)">3 NOK</span><span class="cip" style="background: var(--zemin); color: var(--metin)">1 boş</span>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 14px"><button class="dg">Paylaş</button><button class="dg ikincil">Tekrar oyna</button></div>
  </section>
</template>

<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
  const [w, h] = (p.get('boy') || '390x844').split('x').map(Number);
  document.documentElement.dataset.tema = tema;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('baslik').textContent = `Kafadar — oda modu · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;
  const kap = document.getElementById('ekranlar');
  document.querySelectorAll('template').forEach(t => {
    const f = document.createElement('figure'), c = document.createElement('figcaption');
    c.textContent = t.dataset.ad; f.append(c, t.content.cloneNode(true)); kap.append(f);
  });
  // QR yer tutucu (gerçek QR uygulamada üretilir): köşe işaretleri + sabit desen
  document.querySelectorAll('.qr').forEach(q => {
    const n = 21, s = [];
    const dolu = (x, y) => { for (const [a, b] of [[0, 0], [n - 7, 0], [0, n - 7]]) if (x >= a && x < a + 7 && y >= b && y < b + 7) {
      const i = x - a, j = y - b; return i === 0 || j === 0 || i === 6 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5); }
      return ((x * 7 + y * 13 + x * y) % 5) < 2; };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (dolu(x, y)) s.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
    q.innerHTML = `<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" fill="#0B0920" shape-rendering="crispEdges" role="img" aria-label="Oda kodu QR">${s.join('')}</svg>`;
  });
</script>
