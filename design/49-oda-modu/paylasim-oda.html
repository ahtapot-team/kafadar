<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — oda paylaşım görseli</title>
<!-- #49 KK-36: oda finali 9:16 (1080×1920), seçilen B · Ekolayzer stili (Metehan). Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --kontur: #0B0920; --golge: #7C6CFF;
    --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .gorsel { width: 1080px; height: 1920px; margin: 0 auto; background: var(--zemin); color: var(--metin); padding: 120px 90px 100px;
    display: flex; flex-direction: column; gap: 56px; overflow: hidden; }
  .sticker { display: inline-block; transform: rotate(-4deg); border: 10px solid var(--kontur); border-radius: 44px; box-shadow: 14px 14px 0 var(--golge);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); }
  .eko { height: 760px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 18px; }
  .sutun { display: flex; flex-direction: column-reverse; border-radius: 26px; border: 8px solid var(--kontur); overflow: hidden; background: var(--yuzey); }
  .sutun i { display: block; width: 100%; }
  .sutun.secili { box-shadow: 0 0 0 10px var(--marka); }
  .no { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 18px; text-align: center; font-size: 40px; font-weight: 800; color: var(--soluk); margin-top: -30px; }
</style>
</head>
<body>
<div class="gorsel">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span class="sticker" style="background: var(--marka); font-size: 96px; padding: 16px 44px 26px">Kafadar!</span>
    <span class="sticker" style="background: var(--marka-2); font-size: 48px; padding: 14px 28px 20px; transform: rotate(3deg)">ODA · 8 kişi</span>
  </div>
  <div>
    <div style="font-size: 44px; font-weight: 800; letter-spacing: 0.08em; color: var(--soluk)">10 SORUDA BU ODA</div>
    <div style="font-size: 190px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95"><span style="color: var(--ok)">%43</span> OK</div>
  </div>
  <div class="eko" id="eko"></div>
  <div class="no" id="no"></div>
  <div style="padding: 36px 40px; border-radius: 50px; border: 10px solid var(--kontur); background: var(--marka); color: var(--kontur); box-shadow: 14px 14px 0 var(--golge); transform: rotate(-2deg)">
    <div style="font-size: 36px; font-weight: 800; letter-spacing: 0.08em">ODAYI İKİYE BÖLDÜ · SORU 3</div>
    <div style="margin-top: 14px; font-size: 64px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08">Sevgilinin telefonunu gizlice karıştırmak.</div>
    <div style="margin-top: 14px; font-size: 48px; font-weight: 800"><span style="color: #0F8A4B">4 OK</span> · <span style="color: #D63A2F">4 NOK</span></div>
  </div>
  <div style="margin-top: auto; text-align: center; font-size: 40px; font-weight: 700; color: var(--soluk)">Kafadar ile oynandı · OK mu NOK mu?</div>
</div>
<script>
  // Örnek oda (8 oyuncu): [OK, NOK, boş] — final-secenekler.html ile aynı veri
  const S = [[2,6,0],[1,7,0],[4,4,0],[7,1,0],[5,2,1],[3,5,0],[1,7,0],[6,2,0],[2,5,1],[3,5,0]];
  const y = (x) => (x / 8 * 100) + '%';
  document.getElementById('eko').innerHTML = S.map(([o, n], i) =>
    `<div class="sutun${i === 2 ? ' secili' : ''}"><i style="height:${y(o)};background:var(--ok)"></i><i style="height:${y(n)};background:var(--nok)"></i></div>`).join('');
  document.getElementById('no').innerHTML = S.map((_, i) => `<span style="${i === 2 ? 'color:var(--marka)' : ''}">${i + 1}</span>`).join('');
</script>
</body>
</html>
