<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — tanıtım kartı</title>
<!-- #130 (PRD v6, KK-73…KK-78). Kart = mevcut Diyalog (src/ui.tsx): marka dolgu, 4px kontur, 8px gölge, perde rgba(11,9,32,.7).
     Metinler PRD v6 tablosundan. Kullanım: ?tema=koyu|acik&boy=375x667. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; --w: 375px; --h: 667px; }
  [data-tema="koyu"] { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; max-width: var(--w); }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 12px; padding: 34px 22px 22px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .ust { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
  .esnek { flex: 1; }
  .geri { width: 48px; height: 48px; border-radius: 16px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .nasil { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 6px; border-radius: 999px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .nasil i { width: 30px; height: 30px; border-radius: 50%; background: var(--marka); color: var(--kontur); border: 2px solid var(--kontur); display: grid; place-items: center; font-style: normal; font-size: 17px; }
  .nasil.vurgu { box-shadow: 0 0 0 4px var(--marka), 4px 4px 0 6px var(--golge); }
  .baslik { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .etiket { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); }
  .govde { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; color: var(--soluk); }
  .dg { display: flex; align-items: center; justify-content: center; width: 100%; height: 58px; border-radius: 20px; border: 4px solid var(--kontur); background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font: 800 19px 'Bricolage Grotesque', sans-serif; flex: none; }
  .secim { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 16px; border-radius: 18px; border: 3px solid var(--kontur); background: var(--yuzey); font-weight: 800; font-size: 17px; }
  .secim.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 4px 4px 0 var(--golge); }
  .bolum { display: flex; gap: 8px; } .bolum > div { flex: 1; height: 48px; border-radius: 14px; border: 3px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .bolum > div.sec { background: var(--marka-2); color: var(--kontur); }
  .cip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 12px; border: 3px solid var(--kontur); font-weight: 800; font-size: 14px; background: var(--yuzey); color: var(--metin); white-space: nowrap; }
  /* Tanıtım kartı = Diyalog */
  .perde { position: absolute; inset: 0; background: rgba(11,9,32,.7); display: flex; align-items: center; padding: 22px; }
  .diyalog { width: 100%; background: var(--marka); color: var(--kontur); border: 4px solid var(--kontur); border-radius: 30px; padding: 22px; box-shadow: 8px 8px 0 var(--golge);
    display: flex; flex-direction: column; gap: 14px; transform: rotate(-1deg); }
  .diyalog h3 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .diyalog p { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.42; }
  .diyalog .kisi { align-self: flex-start; background: var(--kontur); color: var(--marka); border-color: var(--kontur); }
  .diyalog .tamam { display: grid; place-items: center; height: 56px; border-radius: 18px; background: var(--kontur); color: var(--marka); font-weight: 800; font-size: 19px; }
  .arka { opacity: .9; }
  .oyun { padding: 14px 16px; border-radius: 22px; border: 4px solid var(--kontur); font-weight: 800; font-size: 20px; }
</style>
</head>
<body>
<h1 id="baslik">Kafadar — tanıtım kartı</h1>
<div id="ekranlar"></div>

<template id="ana">
  <div class="ust"><span class="cip" style="background: var(--marka); color: var(--kontur); font-size: 20px; transform: rotate(-3deg)">Kafadar!</span><span class="geri">⚙</span></div>
  <div class="oyun" style="background: var(--marka); color: var(--kontur)">OK mu NOK mu?</div>
  <div class="oyun" style="background: var(--marka-2); color: var(--kontur)">Casus kim</div>
  <div class="oyun" style="background: var(--yuzey)">10/10 ama</div>
</template>

<template data-ad="4 · “Nasıl oynanır?”: OK mu NOK mu paket ve süre (KK-76)">
  <section class="ekran">
    <div class="ust"><span class="geri">‹</span><a class="nasil vurgu"><i>?</i>Nasıl oynanır?</a></div>
    <h2 class="baslik">Hangi deste?</h2>
    <div class="secim sec">Arkadaş <span class="cip" style="background: var(--kontur); color: var(--marka)">Seçili</span></div>
    <div class="secim">Çift</div><div class="secim">Aile</div>
    <div class="etiket" style="margin-top: 4px">Kaç kart?</div>
    <div class="bolum"><div>10</div><div class="sec">20</div><div>Sınırsız</div></div>
    <div class="esnek"></div><button class="dg">Başla</button>
  </section>
</template>

<template data-ad="5 · “Nasıl oynanır?”: Casus kim ayarları (KK-76)">
  <section class="ekran">
    <div class="ust"><span class="geri">‹</span><a class="nasil vurgu"><i>?</i>Nasıl oynanır?</a></div>
    <h2 class="baslik">Hazırlık</h2>
    <div class="etiket">Paket</div><div class="bolum"><div class="sec">Yerler</div><div style="font-size: 13px">Yiyecek-içecek</div><div>Meslekler</div></div>
    <div class="etiket">Casus sayısı</div><div class="secim">Casus <span>− 1 +</span></div>
    <div class="etiket">Toplam süre</div><div class="bolum"><div class="sec">Kapalı</div><div>3 dk</div><div>5 dk</div><div>8 dk</div></div>
    <div class="esnek"></div><button class="dg">Kartları dağıt</button>
  </section>
</template>

<template data-ad="6 · “Nasıl oynanır?”: 10/10 ama hazırlığı (KK-76)">
  <section class="ekran">
    <div class="ust"><span class="geri">‹</span><a class="nasil vurgu"><i>?</i>Nasıl oynanır?</a></div>
    <h2 class="baslik">Hangi deste?</h2>
    <div class="secim sec">Sevgili adayı <span class="cip" style="background: var(--kontur); color: var(--marka)">Seçili</span></div>
    <div class="secim">Arkadaş</div><div class="secim">Gündelik hayat</div>
    <div class="etiket" style="margin-top: 4px">Kaç kart?</div>
    <div class="bolum"><div>10</div><div class="sec">20</div><div>Sınırsız</div></div>
    <div class="esnek"></div><button class="dg">Başla</button>
  </section>
</template>

<template data-ad="7 · “Nasıl oynanır?”: oda lobisi (KK-76)">
  <section class="ekran">
    <div class="ust"><span class="cip" style="background: var(--marka-2); color: var(--kontur)">ODA</span><a class="nasil vurgu"><i>?</i>Nasıl oynanır?</a></div>
    <div class="etiket" style="text-align: center">Oda kodu</div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">4</div><div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">8</div><div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">2</div>
      <div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">9</div><div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">1</div><div class="secim" style="justify-content: center; padding: 0; font-size: 28px; background: var(--marka); color: var(--kontur)">5</div>
    </div>
    <div class="etiket" style="margin-top: 6px">4 kişi odada</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="cip" style="background: var(--marka); color: var(--kontur)">Murat ★</span><span class="cip">Ayşe</span><span class="cip">Mert</span><span class="cip">Deniz</span></div>
    <div class="esnek"></div><button class="dg">Başlat · 4 kişi</button>
  </section>
</template>

<template data-ad="8 · Odaya kodla ilk katılan: kart lobide bir kez (KK-75)">
  <section class="ekran">
    <div class="ust"><span class="cip" style="background: var(--marka-2); color: var(--kontur)">ODA</span><a class="nasil"><i>?</i>Nasıl oynanır?</a></div>
    <h2 class="baslik" style="margin-top: 20px">İçeridesin!</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="cip">Murat ★</span><span class="cip" style="background: var(--marka); color: var(--kontur)">Elif (sen)</span><span class="cip">Ayşe</span><span class="cip">Mert</span><span class="cip" style="background: var(--marka-2); color: var(--kontur)">Deniz · yeni!</span></div>
    <div class="perde" data-oyun="2" style="align-items: flex-end; padding-bottom: 30px"></div>
  </section>
</template>

<template data-ad="9 · Seçenek B: bağlantı altta, ana düğmenin üstünde (karşılaştırma)">
  <section class="ekran">
    <div class="ust"><span class="geri">‹</span><span></span></div>
    <h2 class="baslik">Hangi deste?</h2>
    <div class="secim sec">Arkadaş <span class="cip" style="background: var(--kontur); color: var(--marka)">Seçili</span></div>
    <div class="secim">Çift</div><div class="secim">Aile</div>
    <div class="etiket" style="margin-top: 4px">Kaç kart?</div>
    <div class="bolum"><div>10</div><div class="sec">20</div><div>Sınırsız</div></div>
    <div class="esnek"></div>
    <a style="align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; font-weight: 800; font-size: 16px; color: var(--metin); text-decoration: underline; text-decoration-color: var(--marka); text-decoration-thickness: 3px; text-underline-offset: 5px; box-shadow: 0 0 0 4px var(--marka); border-radius: 12px; padding: 0 10px">Nasıl oynanır?</a>
    <button class="dg">Başla</button>
  </section>
</template>

<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
  const [w, h] = (p.get('boy') || '375x667').split('x').map(Number);
  document.documentElement.dataset.tema = tema;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('baslik').textContent = `Kafadar — tanıtım kartı ve “Nasıl oynanır?” · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;
  // Metinler: PRD v6 tablosu (oyunun kayıt satırından gelir, KK-77)
  const oyunlar = [
    { ad: 'OK mu NOK mu?', kisi: '2–12 kişi', metin: 'Kartta bir durum çıkar: “İlk buluşmada hesabı bölmek”. 3-2-1’de herkes başparmağıyla OK 👍 ya da NOK 👎 gösterir. Telefonu tutan kişi oyları girer, sonra kimin tek başına kaldığı ortaya çıkar. Oda modunda herkes kendi telefonundan oy verir.' },
    { ad: 'Casus kim', kisi: '3–12 kişi', metin: 'Telefon elden ele dolaşır. Herkes aynı kelimeyi görür, casus ise yalnızca bir ipucu. Sırayla birbirinize kelimeyle ilgili sorular sorun, ama kelimeyi söylemeyin. Sonunda casusu oylayın. Yakalanan casus kelimeyi bilirse yine kazanır.' },
    { ad: '10/10 ama', kisi: '2–12 kişi', metin: 'Kartta kusursuz biri ve bir “ama” var: “10/10 ama sabah 5’te kalkıyor”. Herkes parmaklarıyla 0–10 arası yeni puanını gösterir, telefonu tutan kişi puanları girer. Ortalama ve en uç puanlar açıklanır. Oda modunda puanlar gizlidir ve her karttan sonra açılır.' },
  ];
  const diyalog = (o) => `<div class="diyalog" role="dialog" aria-label="${o.ad} nasıl oynanır"><h3>${o.ad}</h3><span class="cip kisi">${o.kisi}</span><p>${o.metin}</p><div class="tamam" role="button">Tamam</div></div>`;
  const kap = document.getElementById('ekranlar');
  const ekle = (ad, html) => { const f = document.createElement('figure'), c = document.createElement('figcaption'); c.textContent = ad; f.append(c); f.insertAdjacentHTML('beforeend', html); kap.append(f); };
  const ana = document.getElementById('ana').innerHTML;
  oyunlar.forEach((o, i) => ekle(`${i + 1} · İlk dokunuş: ${o.ad.replace('?', '')} tanıtım kartı (KK-73)`,
    `<section class="ekran"><div class="arka" style="display:flex;flex-direction:column;gap:12px">${ana}</div><div class="perde">${diyalog(o)}</div></section>`));
  document.querySelectorAll('template[data-ad]').forEach(t => {
    const f = document.createElement('figure'), c = document.createElement('figcaption');
    c.textContent = t.dataset.ad; f.append(c, t.content.cloneNode(true)); kap.append(f);
  });
  document.querySelectorAll('.perde[data-oyun]').forEach(d => d.innerHTML = diyalog(oyunlar[+d.dataset.oyun]));
</script>
</body>
</html>
