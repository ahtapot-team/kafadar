<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — Casus kim ekranları</title>
<!-- #80. Çıkartma kiti (design/TASARIM-SISTEMI.md). Oyun rengi nötr mavi (marka-2); yeşil yalnızca "grup yakaladı", kırmızı yalnızca "casus kazandı" (KK-52).
     Kullanım: ?tema=koyu|acik&boy=390x844|375x667. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; --w: 390px; --h: 844px; }
  [data-tema="koyu"] { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --ok-metin: #3DDC84; --nok-metin: #FF5A4E; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; --ok-metin: #0F8A4B; --nok-metin: #D63A2F; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; max-width: var(--w); }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 14px; padding: calc(var(--h) * 0.06) 22px 26px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .esnek { flex: 1; min-height: 0; }
  .orta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ikon-dg { width: 48px; height: 48px; flex: none; border-radius: 16px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); display: grid; place-items: center; }
  .dg { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 62px; border-radius: 20px; border: 4px solid var(--kontur);
    background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font: 800 20px 'Bricolage Grotesque', sans-serif; }
  .dg.ikincil { background: var(--yuzey); color: var(--metin); }
  .dg.hayalet { background: transparent; color: var(--soluk); border-color: transparent; box-shadow: none; height: 48px; font-size: 16px; }
  .baslik { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .etiket { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); }
  .govde { font-size: 16px; font-weight: 500; line-height: 1.45; color: var(--soluk); margin: 0; }
  .sticker { display: inline-block; transform: rotate(-4deg); padding: 4px 16px 8px; border-radius: 16px; border: 4px solid var(--kontur);
    box-shadow: 5px 5px 0 var(--golge); font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); }
  .cip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 6px 12px; border-radius: 12px; border: 3px solid var(--kontur); font-weight: 800; font-size: 15px; background: var(--yuzey); color: var(--metin); }
  .cip.sec { background: var(--marka-2); color: var(--kontur); }
  .oyun { background: var(--marka-2); color: var(--kontur); transform: rotate(2deg); }
  .kart { padding: 22px 20px; border-radius: 30px; border: 4px solid var(--kontur); background: var(--marka-2); color: var(--kontur); box-shadow: 8px 8px 0 var(--golge); }
  .rol { height: calc(var(--h) * 0.42); display: flex; flex-direction: column; justify-content: space-between; transform: rotate(-2deg); }
  .rol .ana { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .rol .alt { font-size: 18px; font-weight: 700; }
  .bolum { display: flex; gap: 8px; }
  .bolum > div { flex: 1; height: 52px; border-radius: 14px; border: 3px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .bolum > div.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 4px 4px 0 var(--golge); }
  .satir { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 18px; border: 3px solid var(--kontur); background: var(--yuzey); font-weight: 800; font-size: 17px; }
  .adim { display: flex; align-items: center; gap: 10px; }
  .adim span { width: 44px; height: 44px; border-radius: 14px; border: 3px solid var(--kontur); display: grid; place-items: center; font-size: 22px; background: var(--zemin); }
  .halka { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
  .halka svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .sik { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .sik > div { height: 64px; border-radius: 18px; border: 4px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .sik > div.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); transform: rotate(-2deg); }
  .bulanik { position: absolute; inset: 0; backdrop-filter: blur(18px); background: rgba(22,18,63,.55); display: grid; place-items: center; }
</style>
</head>

<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
  const [w, h] = (p.get('boy') || '390x844').split('x').map(Number);
  document.documentElement.dataset.tema = tema;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('baslik').textContent = `Kafadar — Casus kim · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;
  const kap = document.getElementById('ekranlar');
  document.querySelectorAll('template').forEach(t => {
    const f = document.createElement('figure'), c = document.createElement('figcaption');
    c.textContent = t.dataset.ad; f.append(c, t.content.cloneNode(true)); kap.append(f);
  });
  // Çark: 8 dilim, isimler; seçilen (Deniz) üstte
  const adlar = ['Deniz', 'Elif', 'Ali', 'Zeynep', 'Murat', 'Ayşe', 'Mert', 'Can'];
  document.querySelectorAll('.cark').forEach(svg => {
    const n = adlar.length, r = 100, parca = [];
    adlar.forEach((ad, i) => {
      const a0 = (i - 0.5) / n * 2 * Math.PI - Math.PI / 2, a1 = (i + 0.5) / n * 2 * Math.PI - Math.PI / 2, am = (a0 + a1) / 2;
      const d = `M0 0 L${r * Math.cos(a0)} ${r * Math.sin(a0)} A${r} ${r} 0 0 1 ${r * Math.cos(a1)} ${r * Math.sin(a1)} Z`;
      const renk = i === 0 ? 'var(--marka)' : i % 2 ? 'var(--marka-2)' : 'var(--yuzey)';
      const yazi = i === 0 || i % 2 ? 'var(--kontur)' : 'var(--metin)';
      parca.push(`<path d="${d}" fill="${renk}" stroke="var(--kontur)" stroke-width="4"/>`,
        `<text x="${62 * Math.cos(am)}" y="${62 * Math.sin(am)}" fill="${yazi}" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${am * 180 / Math.PI + (Math.cos(am) < -0.01 ? 180 : 0)} ${62 * Math.cos(am)} ${62 * Math.sin(am)})">${ad}</text>`);
    });
    parca.push('<circle r="16" fill="var(--zemin)" stroke="var(--kontur)" stroke-width="4"/>');
    svg.innerHTML = parca.join('');
  });
</script>
</body>
</html>
