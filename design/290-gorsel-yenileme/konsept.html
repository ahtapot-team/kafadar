<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — #290/#292 Görsel yenileme</title>
<!-- #290: ana ekran A (Semih msg 1051), ikon = logo zemini + kendi 3D nesnemiz (msg 1053, 1069), kaplama C ve paket b (msg 1082). Emoji yok.
     #292: açık tema, eksik durumlar, uygulamaya hazır görsel seti. Katmanlar uygulamadaki gibi: token renk → desen (assets/gorsel/desen/*.webp)
     → nesne (assets/gorsel/*.webp). Kaynaklar: gorsel/sahne.html (nesne), gorsel/desen.html (desen); bkz. gorsel/LISANS.md.
     Kullanım: ?ekran=ana|one-cikan|bos|tanitim|paket [&tema=acik] [&dock=koyu] → tek ekran 390×844 (mobil PNG)
               ?sayfa=durumlar | bilesen → karşılaştırma sayfası (masaüstü PNG). Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --krem: #FFF8E7; --gece: #2B2570;
    --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --dock: rgba(43,37,112,.9); }
  /* Açık tema: src/tema.ts renkler.acik. kontur, golge, marka, marka-2 ve oyun zeminleri iki temada aynı. */
  .acik { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; --dock: rgba(255,255,255,.92); }
  .dock-koyu .dock { --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --dock: rgba(22,18,63,.96); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 28px 0 0; font-size: 22px; color: #2a2640; text-align: center; }
  h2.tema { flex-basis: 100%; margin: 8px 0 -14px; font-size: 18px; color: #2a2640; }
  .sahne { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 20px 24px 40px; }
  figure { margin: 0; } figcaption { max-width: 390px; margin-bottom: 8px; font-size: 14px; font-weight: 700; line-height: 1.35; color: #4a4566; }
  .ekran { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; background: var(--zemin); color: var(--metin);
    box-shadow: 0 16px 40px rgba(20,16,50,.22); display: flex; flex-direction: column; padding: 0 20px; }
  body.tek h1, body.tek figcaption { display: none; } body.tek .sahne { padding: 0; } body.tek .ekran { border-radius: 0; box-shadow: none; }
  .duvar { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 92% 30%, rgba(124,108,255,.30) 0 110px, transparent 111px),
      radial-gradient(circle at 0% 66%, rgba(91,140,255,.16) 0 130px, transparent 131px),
      radial-gradient(circle at 70% 96%, rgba(255,210,63,.09) 0 90px, transparent 91px); }
  .acik .duvar { background: radial-gradient(circle at 92% 30%, rgba(124,108,255,.16) 0 110px, transparent 111px),
      radial-gradient(circle at 0% 66%, rgba(255,210,63,.24) 0 130px, transparent 131px),
      radial-gradient(circle at 70% 96%, rgba(91,140,255,.10) 0 90px, transparent 91px); }
  .ekran > *:not(.duvar):not(.dock):not(.sol):not(.perde) { position: relative; }
  .durum { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 15px; font-weight: 800; }
  .pil { width: 26px; height: 13px; border: 2px solid var(--metin); border-radius: 4px; padding: 1px; } .pil::after { content: ''; display: block; width: 70%; height: 100%; background: var(--metin); border-radius: 1px; }
  .ust { display: flex; align-items: center; gap: 10px; flex: none; } .ust .orta { flex: 1; }
  .logo { display: inline-block; transform: rotate(-3deg); padding: 2px 12px 5px; border-radius: 14px; border: 4px solid var(--kontur); background: var(--marka);
    box-shadow: 5px 5px 0 var(--golge); color: var(--kontur); font-size: 27px; font-weight: 800; letter-spacing: -0.04em; }
  .kare { width: 48px; height: 48px; flex: none; border-radius: 14px; border: 3px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center;
    font-weight: 800; font-size: 24px; color: var(--metin); }
  .kare img { width: 46px; height: 46px; margin: -4px; }
  .bilgi-i { width: 26px; height: 26px; border-radius: 50%; background: var(--marka); border: 3px solid var(--kontur); color: var(--kontur);
    display: inline-grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
  .bilgi-yazili { height: 48px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 9px; border-radius: 14px; border: 3px solid var(--kontur);
    background: var(--yuzey); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .ust-yazi { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--soluk); }
  .cipler { display: flex; gap: 8px; flex: none; }
  .fcip { flex: 1 1 auto; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 9px; border-radius: 14px;
    border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); font-size: 15px; font-weight: 800; white-space: nowrap; }
  .fcip.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 4px 4px 0 var(--golge); }
  /* ---- İkon: token renk + desen katmanı + nesne. Nesne iç alanın 1.28 katı, ortalı; taşan kısım saydam (C) ---- */
  .ikon { --b: 138px; --k: 4px; --r: 38px; position: relative; width: var(--b); height: var(--b); border-radius: var(--r); border: var(--k) solid var(--kontur);
    box-shadow: 6px 6px 0 var(--golge); background: var(--c); overflow: hidden; display: grid; place-items: center; flex: none; }
  .ikon .desen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ikon .nesne { position: relative; width: calc((var(--b) - 2 * var(--k)) * 1.28); height: calc((var(--b) - 2 * var(--k)) * 1.28); margin: calc((var(--b) - 2 * var(--k)) * -0.14); }
  .ikon.bas { transform: scale(.94); box-shadow: 2px 2px 0 var(--golge); } .ikon.bas-az { opacity: .7; }
  .z-ok-mu-nok { --c: var(--marka); } .z-on-on-ama { --c: var(--marka-2); } .z-casus-kim { --c: var(--golge); } .z-quiz-night { --c: var(--gece); }
  .z-dizi-film { --c: var(--marka); } .z-muzik { --c: var(--marka-2); } .z-spor { --c: var(--golge); }
  /* ---- Ana ekran ---- */
  .widget { margin-top: 18px; flex: none; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 26px; border: 4px solid var(--kontur);
    background: var(--yuzey); box-shadow: 6px 6px 0 var(--golge); }
  .widget .ikon { --b: 62px; --k: 3px; --r: 18px; box-shadow: none; }
  .widget .yazi { flex: 1; min-width: 0; }
  .widget b { display: block; white-space: nowrap; font-size: 17px; line-height: 1.15; margin: 2px 0; }
  .widget small { display: block; font-size: 13px; font-weight: 700; color: var(--soluk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dugme { height: 48px; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 14px; border: 3px solid var(--kontur);
    background: var(--marka); color: var(--kontur); font-size: 15px; font-weight: 800; box-shadow: 4px 4px 0 var(--golge); white-space: nowrap; }
  .dugme::before { content: ''; border-left: 10px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; margin-top: 30px; flex: none; }
  .uyg { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .uyg b { margin-top: 12px; font-size: 17px; font-weight: 800; line-height: 1.1; }
  .uyg small { margin-top: 3px; font-size: 13px; font-weight: 700; color: var(--soluk); }
  .ipucu { margin: 22px 0 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--soluk); flex: none; }
  .bos { grid-column: 1 / -1; height: 185px; display: grid; place-items: center; padding: 0 36px; border: 3px dashed var(--soluk); border-radius: 20px;
    text-align: center; font-size: 17px; font-weight: 500; line-height: 25px; color: var(--soluk); }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 18px; padding: 10px 12px 12px; border-radius: 32px; border: 3px solid var(--kontur); background: var(--dock); }
  .dock .ust-yazi { margin: 0 4px 7px; }
  /* ---- Tanıtım kartı: mevcut Diyalog (marka kart) + sağ üstte oyunun ikonu ---- */
  .perde { position: absolute; inset: 0; z-index: 5; background: rgba(11,9,32,.7); display: flex; align-items: center; padding: 22px; }
  .diyalog { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 30px; border: 4px solid var(--kontur);
    background: var(--marka); color: var(--kontur); box-shadow: 8px 8px 0 var(--golge); }
  .diyalog .ikon { --b: 84px; --r: 24px; position: absolute; top: -38px; right: 20px; transform: rotate(6deg); box-shadow: 4px 4px 0 var(--golge); }
  .diyalog h3 { margin: 0; padding-right: 84px; font-size: 36px; font-weight: 800; line-height: 1.05; }
  .diyalog .kisi { align-self: flex-start; padding: 4px 12px; border-radius: 12px; background: var(--kontur); color: var(--marka); font-size: 14px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase; }
  .diyalog p { margin: 0; font-size: 17px; font-weight: 500; line-height: 25px; }
  .diyalog .tamam { min-height: 48px; display: grid; place-items: center; border-radius: 20px; background: var(--kontur); color: var(--marka); font-size: 14px;
    font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  /* ---- Paket ekranı (b): kart zemini kategori deseni, nesne sağ üstten taşar ---- */
  .baslik { margin: 10px 0 12px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; flex: none; }
  .kartlar { display: flex; flex-direction: column; gap: 22px; margin-top: 26px; flex: none; }
  .kart { position: relative; width: 350px; min-height: 135px; padding: 22px 116px 16px 16px; border-radius: 24px; border: 4px solid var(--kontur);
    box-shadow: 6px 6px 0 var(--golge); background: var(--c); color: var(--kontur); }
  .kart .kz { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; } .kart .kz img { width: 100%; height: 100%; object-fit: cover; }
  .kart > b, .kart > .meta { position: relative; z-index: 1; }
  .kart b { display: block; font-size: 18px; font-weight: 800; line-height: 1.15; }
  .kart .meta { margin-top: 6px; font-size: 12px; font-weight: 700; line-height: 1.5; } .kart .nw { white-space: nowrap; }
  .kart > img { position: absolute; right: 4px; top: -24px; width: 112px; height: 112px; z-index: 2; }
  .rozet { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; margin-right: 7px; border-radius: 10px; border: 2px solid var(--kontur);
    background: var(--zemin); color: var(--metin); font-size: 12px; font-weight: 800; vertical-align: 1px; }
  .sol { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--zemin)); pointer-events: none; }
  /* ---- Bileşen sayfası ---- */
  .pano { padding: 30px 28px 34px; border-radius: 28px; background: var(--zemin); color: var(--metin); display: flex; flex-wrap: wrap; gap: 34px 28px; align-items: flex-start; }
  .pano .etk { flex-basis: 100%; margin-bottom: -16px; } .durumlar { display: flex; gap: 30px; } .durumlar .uyg small { max-width: 150px; }
</style>
</head>
<body>
<h1>Kafadar — #292 · Açık tema, eksik durumlar · 390×844</h1>
<div class="sahne" id="sahne"></div>
<script>
const p = new URLSearchParams(location.search);
const G = (ad) => `assets/gorsel/${ad}.webp`, D = (ad) => `assets/gorsel/desen/${ad}.webp`;
const durum = '<div class="durum"><span>21:30</span><span class="pil"></span></div>';
const ust = (sol, sag) => `<div class="ust">${sol}<span class="orta"></span>${sag}</div>`;
const ikon = (g, ek = '') => `<span class="ikon z-${g} ${ek}"><img class="desen" src="${D(g)}" alt=""><img class="nesne" src="${G(g)}" alt=""></span>`;
const OYUN = [
  { ad: 'OK mu NOK mu', kisi: '2–12 kişi', g: 'ok-mu-nok' },
  { ad: '10/10 ama', kisi: '2–12 kişi', g: 'on-on-ama' },
  { ad: 'Casus kim', kisi: '3–12 kişi', g: 'casus-kim' },
  { ad: 'Quiz Night', kisi: '1–12 kişi', g: 'quiz-night' },
];
const uyg = (o, ek) => `<div class="uyg" role="button" aria-label="${o.ad}, ${o.kisi}">${ikon(o.g, ek)}<b>${o.ad}</b><small>${o.kisi}</small></div>`;
const CIP = ['Tümü', '1 kişi', '2 kişi', '3+ kişi'];
const dock = (sec = 0) => `<div class="dock"><div class="ust-yazi">Kaç kişisiniz?</div><div class="cipler" role="radiogroup" aria-label="Kişi sayısı">${CIP.map((c, i) =>
  `<span class="fcip${i === sec ? ' sec' : ''}" role="radio" aria-checked="${i === sec}">${i === sec ? '✓ ' : ''}${c}</span>`).join('')}</div></div>`;
const widget = (etk, o, alt) => `<div class="widget">${ikon(o.g)}<div class="yazi"><div class="ust-yazi">${etk}</div><b>${o.ad}</b><small>${alt}</small></div>
  <span class="dugme" role="button">Oyna</span></div>`;
// v: son | one | bos | tanitim
const ana = (v = 'son') => `<div class="duvar"></div>${durum}
  ${ust('<span class="logo">Kafadar</span>', `<span class="kare" aria-label="Ayarlar"><img src="${G('ayarlar')}" alt=""></span>`)}
  ${v === 'one' ? widget('Öne çıkan', OYUN[3], '1–12 kişi') : widget('Son oynanan', OYUN[0], '4 kişi · Aile paketi')}
  <div class="izgara">${v === 'bos' ? '<div class="bos">Bu kişi sayısına uygun oyun henüz yok.</div>' : OYUN.map(o => uyg(o)).join('')}</div>
  ${v === 'bos' ? '' : '<p class="ipucu">Kuralları görmek için oyuna basılı tut</p>'}
  ${dock(v === 'bos' ? 1 : 0)}
  ${v === 'tanitim' ? `<div class="perde"><div class="diyalog" role="dialog" aria-label="Casus kim">${ikon('casus-kim')}<h3>Casus kim</h3>
    <span class="kisi">3–12 kişi</span><p>Telefon elden ele dolaşır. Herkes aynı kelimeyi görür, casus ise yalnızca bir ipucu. Sırayla birbirinize kelimeyle ilgili sorular sorun, ama kelimeyi söylemeyin. Sonunda casusu oylayın. Yakalanan casus kelimeyi bilirse yine kazanır.</p>
    <span class="tamam" role="button">Tamam</span></div></div>` : ''}`;

const KAT = {
  'dizi-film': { not: 'Resmî değildir · Spoiler içerir' },
  muzik: { not: 'Resmî değildir · Sanatçıyla bağlantısı yoktur' },
  spor: { not: 'Resmî değildir · Kulüple bağlantısı yoktur' },
};
const PAKET = [
  { k: 'dizi-film', ad: 'Aşk-ı Memnu', g: 'ask-i-memnu', koken: 'Türk' },
  { k: 'dizi-film', ad: 'Hababam Sınıfı', g: 'hababam-sinifi', koken: 'Türk' },
  { k: 'dizi-film', ad: 'Prison Break', g: 'prison-break', koken: 'Yabancı' },
  { k: 'muzik', ad: 'Manifest', g: 'manifest' },
  { k: 'muzik', ad: 'Emir Can İğrek', g: 'emir-can-igrek' },
  { k: 'muzik', ad: 'BLOK3', g: 'blok3' },
  { k: 'muzik', ad: 'Mabel Matiz', g: 'mabel-matiz' },
  { k: 'spor', ad: 'Galatasaray', g: 'spor', baslik: 'Ne kadar Galatasaraylısın?' },
  { k: 'spor', ad: 'Fenerbahçe', g: 'spor', baslik: 'Ne kadar Fenerbahçelisin?' },
  { k: 'spor', ad: 'Beşiktaş', g: 'spor', baslik: 'Ne kadar Beşiktaşlısın?' },
];
const kart = (x) => `<div class="kart z-${x.k}" role="button"><span class="kz"><img src="${D(x.k)}" alt=""></span><b>${x.baslik || `Ne kadar ${x.ad} fanısın?`}</b>
  <div class="meta">${x.koken ? `<span class="rozet">${x.koken}</span>` : ''}${KAT[x.k].not.split(' · ').map(t => `<span class="nw">${t}</span>`).join(' · ')}</div>
  <img src="${G(x.g)}" alt=""></div>`;
const paket = () => `<div class="duvar"></div>${durum}${ust('<span class="kare" aria-label="Geri">←</span>', '<span class="bilgi-yazili"><span class="bilgi-i">i</span>Nasıl oynanır</span>')}
  <h2 class="baslik">Neyin fanısın?</h2>
  <div class="cipler" role="radiogroup" aria-label="Kategori"><span class="fcip sec">✓ Tümü</span><span class="fcip">Dizi & Film</span><span class="fcip">Müzik</span><span class="fcip">Spor</span></div>
  <div class="kartlar">${PAKET.map(kart).join('')}</div><div class="sol"></div>`;

const EKRAN = {
  ana: ['Ana ekran · Son oynanan', () => ana('son')],
  'one-cikan': ['Öne çıkan · hiç oyun başlatılmamışken (ya da son oyun kayıttan kalkmışsa). Kart kişi çipleriyle süzülmez', () => ana('one')],
  bos: ['Boş liste · seçili çipe uyan oyun yok (bugün her çipte en az bir oyun var; örnek). İpucu satırı gizlenir', () => ana('bos')],
  tanitim: ['Tanıtım kartı · ikona ~0,5 sn basılı tutunca. Diyalog aynı; sağ üstte oyunun ikonu. "Tamam" kapatır, ana ekranda kalınır', () => ana('tanitim')],
  paket: ['Paket ekranı (b) · kart en az 135 yükseklik; zemin token renk + kategori deseni', paket],
};
const tema = p.get('tema') === 'acik' ? 'acik' : '', dk = p.get('dock') === 'koyu' ? 'dock-koyu' : '';
const ekran = (id, t, ek = '') => `<figure><figcaption>${(t ? 'Açık · ' : 'Koyu · ') + EKRAN[id][0]}</figcaption><section class="ekran ${t} ${ek}">${EKRAN[id][1]()}</section></figure>`;
const pano = (t) => `<div class="pano ${t}"><div class="ust-yazi etk">${t ? 'Açık tema' : 'Koyu tema'} · paket kartları yan yana</div>
  ${['dizi-film', 'muzik', 'spor'].map(k => kart(PAKET.find(x => x.k === k))).join('')}
  <div class="ust-yazi etk">İkon durumları</div><div class="durumlar">${uyg({ ad: 'Normal', kisi: 'gölge 6 px', g: 'on-on-ama' })}
  ${uyg({ ad: 'Basılı', kisi: '%94 ölçek, gölge 2 px, 90 ms', g: 'on-on-ama' }, 'bas')}
  ${uyg({ ad: 'Basılı · hareketi azalt', kisi: 'ölçek yok, opaklık 0,7', g: 'on-on-ama' }, 'bas-az')}</div></div>`;

const sayfa = p.get('sayfa'), tek = p.get('ekran');
let html;
if (sayfa === 'durumlar') html = ['', 'acik'].map(t => ['one-cikan', 'bos', 'tanitim'].map(id => ekran(id, t)).join('')).join('');
else if (sayfa === 'bilesen') html = pano('') + pano('acik');
else if (tek) { document.body.classList.add('tek'); html = ekran(tek, tema, dk); }
else html = Object.keys(EKRAN).map(id => ekran(id, '') + ekran(id, 'acik')).join('');
document.getElementById('sahne').innerHTML = html;
</script>
</body>
</html>
