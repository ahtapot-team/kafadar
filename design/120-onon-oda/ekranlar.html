<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — 10/10 ama oda modu</title>
<!-- #120 (PRD v5). Yalnızca farklar; kod/QR/lobi/katıl/yeniden bağlanma = design/49-oda-modu, puan rengi ve açıklama dili = design/107-on-on-ama.
     Puan rengi: 0–3 nok, 4–6 marka, 7–10 ok. Oda rozeti marka-2. Kullanım: ?tema=koyu|acik&boy=375x667. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; --w: 375px; --h: 667px; }
  [data-tema="koyu"] { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; max-width: var(--w); }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 10px; padding: 34px 20px 22px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .ust { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .esnek { flex: 1; min-height: 0; }
  .orta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .dg { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 20px; border: 4px solid var(--kontur);
    background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font: 800 19px 'Bricolage Grotesque', sans-serif; flex: none; }
  .dg.bekle { background: var(--yuzey); color: var(--soluk); border-style: dashed; box-shadow: none; font-size: 17px; }
  .etiket { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); }
  .govde { font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--soluk); margin: 0; }
  .sticker { display: inline-block; transform: rotate(-4deg); padding: 4px 14px 8px; border-radius: 16px; border: 4px solid var(--kontur);
    box-shadow: 5px 5px 0 var(--golge); font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); white-space: nowrap; }
  .cip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 12px; border: 3px solid var(--kontur); font-weight: 800; font-size: 14px; background: var(--yuzey); color: var(--metin); white-space: nowrap; }
  .oda { background: var(--marka-2); color: var(--kontur); transform: rotate(2deg); }
  .on { display: inline-block; padding: 1px 8px 3px; border-radius: 10px; background: var(--kontur); color: var(--marka); transform: rotate(-3deg); font-size: 14px; }
  .mini-kart { padding: 11px 14px; border-radius: 20px; border: 3px solid var(--kontur); background: var(--marka); color: var(--kontur); font-weight: 800; font-size: 16px; line-height: 1.2; transform: rotate(-1deg); }
  .k { background: var(--nok); color: var(--kontur); } .s { background: var(--marka); color: var(--kontur); } .y { background: var(--ok); color: var(--kontur); }
  .secim { padding: 13px 16px; border-radius: 22px; border: 4px solid var(--kontur); }
  .tus { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tus > div { height: 56px; border-radius: 16px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin); display: grid; place-items: center; font-weight: 800; font-size: 24px; }
  .tus > div.k { box-shadow: inset 0 -6px 0 var(--nok); } .tus > div.s { box-shadow: inset 0 -6px 0 var(--marka); } .tus > div.y { box-shadow: inset 0 -6px 0 var(--ok); }
  .tus > div.sec { background: var(--ok); color: var(--kontur); box-shadow: 4px 4px 0 var(--golge); transform: rotate(-4deg) scale(1.06); }
  .halka { position: relative; width: 54px; height: 54px; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .halka svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .tik { width: 20px; height: 20px; border-radius: 50%; background: var(--marka); border: 2px solid var(--kontur); display: inline-grid; place-items: center; color: var(--kontur); font-size: 12px; font-weight: 800; }
  .bar { display: grid; grid-template-columns: 62px 1fr 30px; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
  .bar .yol { height: 24px; border-radius: 9px; border: 3px solid var(--kontur); background: var(--yuzey); overflow: hidden; }
  .bar .yol i { display: block; height: 100%; border-right: 3px solid var(--kontur); }
  .kart { padding: 14px 16px; border-radius: 24px; border: 4px solid var(--kontur); box-shadow: 5px 5px 0 var(--golge); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="telefon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></g></symbol>
</svg>
<h1 id="baslik">Kafadar — 10/10 ama oda modu</h1>
<div id="ekranlar"></div>

<template data-ad="1 · Mod seçimi: 10/10 ama (KK-63)">
  <section class="ekran" style="gap: 12px">
    <div class="ust"><span class="cip">‹</span><div class="etiket">10/10 ama</div><span style="width: 34px"></span></div>
    <h2 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Nasıl oynuyoruz?</h2>
    <div class="secim" style="background: var(--marka); color: var(--kontur); box-shadow: 6px 6px 0 var(--golge); transform: rotate(-1.5deg)">
      <div style="font-size: 22px; font-weight: 800">Tek telefon</div><div style="font-size: 14px; font-weight: 600">Telefon elden ele, herkes parmakla gösterir</div>
    </div>
    <div class="secim" style="background: var(--marka-2); color: var(--kontur); box-shadow: 6px 6px 0 var(--golge); transform: rotate(1deg)">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 22px; font-weight: 800">Oda kur</span><span style="display: flex"><svg width="24" height="24"><use href="#telefon"/></svg><svg width="24" height="24" style="margin-left: -9px"><use href="#telefon"/></svg></span></div>
      <div style="font-size: 14px; font-weight: 600">Herkes gizli puan verir. Her karttan sonra açıklama.</div>
    </div>
    <div class="secim" style="background: var(--yuzey)">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 22px; font-weight: 800">Odaya katıl</span><span class="cip" style="letter-spacing: .08em; font-size: 13px">482 915</span></div>
      <div style="font-size: 14px; font-weight: 600; color: var(--soluk)">Arkadaşının 6 haneli kodu ile</div>
    </div>
    <div class="esnek"></div>
    <p class="govde" style="text-align: center; font-size: 13px">Odada 10 kart, her biri 15 sn. Kod, QR ve lobi OK mu NOK mu odasıyla aynı.</p>
  </section>
</template>

<template data-ad="2 · Kart + gizli puan, 15 sn (KK-64, KK-65)">
  <section class="ekran">
    <div class="ust">
      <span class="cip oda">ODA</span>
      <div style="font-weight: 800; font-size: 17px">Kart 3 <span style="color: var(--soluk)">/ 10</span></div>
      <div class="halka"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--yuzey)" stroke-width="5"/><circle cx="27" cy="27" r="22" fill="none" stroke="var(--marka)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="55"/></svg>9</div>
    </div>
    <div class="mini-kart" style="font-size: 20px; padding: 16px; transform: rotate(-2deg); box-shadow: 5px 5px 0 var(--golge); border-width: 4px"><span class="on" style="font-size: 18px">10/10</span><br>ama her sabah 5'te kalkıp seni de kaldırıyor.</div>
    <div class="etiket" style="margin-top: 4px">Senin puanın · gizli</div>
    <div class="tus">
      <div class="k">0</div><div class="k">1</div><div class="k">2</div><div class="k">3</div>
      <div class="s">4</div><div class="s">5</div><div class="s">6</div><div class="y sec">7</div>
      <div class="y">8</div><div class="y">9</div><div class="y" style="grid-column: span 2">10</div>
    </div>
    <div class="esnek"></div>
    <p class="govde" style="text-align: center; font-size: 13px">Süre bitene kadar değiştirebilirsin. Puanlar açıklamaya kadar kimseye gitmez.</p>
  </section>
</template>

<template data-ad="3 · Puanın alındı ✓ · 6/8 (KK-65)">
  <section class="ekran">
    <div class="ust"><span class="cip oda">ODA</span><div style="font-weight: 800; font-size: 17px">Kart 3 <span style="color: var(--soluk)">/ 10</span></div><div class="halka" style="color: var(--soluk)">6</div></div>
    <div class="orta esnek" style="gap: 14px">
      <span class="sticker" style="background: var(--marka); font-size: 34px">Puanın alındı ✓</span>
      <div style="font-size: 50px; font-weight: 800; letter-spacing: -0.03em">6 / 8</div>
      <p class="govde">puan verdi. Kim kaç verdi, birazdan.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 7px; justify-content: center">
        <span class="cip"><span class="tik">✓</span>Murat</span><span class="cip"><span class="tik">✓</span>Ayşe</span><span class="cip"><span class="tik">✓</span>Mert</span><span class="cip"><span class="tik">✓</span>Deniz</span>
        <span class="cip"><span class="tik">✓</span>Can</span><span class="cip"><span class="tik">✓</span>Elif</span><span class="cip" style="opacity: .55; border-style: dashed">Ali…</span><span class="cip" style="opacity: .55; border-style: dashed">Zeynep…</span>
      </div>
    </div>
  </section>
</template>

<template data-ad="4 · Ortak açıklama, kuranın telefonu (KK-67, KK-68)">
  <section class="ekran">
    <div class="ust"><span class="cip oda">ODA</span><div class="etiket">Kart 3 / 10 · açıklama</div><span style="width: 44px"></span></div>
    <div class="mini-kart"><span class="on">10/10</span> ama her sabah 5'te kalkıp seni de kaldırıyor.</div>
    <div class="orta"><div style="font-size: 72px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95">5,3<span style="font-size: 28px; color: var(--soluk)">/10</span></div></div>
    <div style="display: flex; justify-content: space-between"><span class="sticker k" style="font-size: 19px">Ayşe 1 verdi!</span><span class="sticker y" style="font-size: 19px; transform: rotate(3deg)">Can 10 verdi!</span></div>
    <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 4px">
      <div class="bar"><span>Can</span><span class="yol"><i class="y" style="width: 100%"></i></span><span>10</span></div>
      <div class="bar"><span>Deniz</span><span class="yol"><i class="y" style="width: 80%"></i></span><span>8</span></div>
      <div class="bar"><span>Murat</span><span class="yol"><i class="y" style="width: 70%"></i></span><span>7</span></div>
      <div class="bar"><span>Mert</span><span class="yol"><i class="s" style="width: 50%"></i></span><span>5</span></div>
      <div class="bar"><span>Elif</span><span class="yol"><i class="s" style="width: 40%"></i></span><span>4</span></div>
      <div class="bar"><span>Ali</span><span class="yol"><i class="k" style="width: 20%"></i></span><span>2</span></div>
      <div class="bar"><span>Ayşe</span><span class="yol"><i class="k" style="width: 10%"></i></span><span>1</span></div>
      <div class="bar" style="color: var(--soluk)"><span>Zeynep</span><span class="yol" style="border-style: dashed"></span><span>—</span></div>
    </div>
    <div class="esnek"></div>
    <button class="dg">Sonraki kart</button>
  </section>
</template>

<template data-ad="5 · Ortak açıklama, diğer telefonlar · “Tam bölündünüz” hâli (KK-67, KK-68)">
  <section class="ekran">
    <div class="ust"><span class="cip oda">ODA</span><div class="etiket">Kart 6 / 10 · açıklama</div><span style="width: 44px"></span></div>
    <div class="mini-kart"><span class="on">10/10</span> ama annesiyle her gün 2 saat telefonda.</div>
    <div class="orta" style="gap: 6px"><span class="sticker s" style="font-size: 26px">Tam bölündünüz!</span><div style="font-size: 64px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95">5,1<span style="font-size: 26px; color: var(--soluk)">/10</span></div></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="kart k" style="transform: rotate(-3deg); text-align: center"><div style="font-size: 44px; font-weight: 800; line-height: 1">0</div><div style="font-weight: 800">Ayşe</div></div>
      <div class="kart y" style="transform: rotate(3deg); text-align: center"><div style="font-size: 44px; font-weight: 800; line-height: 1">10</div><div style="font-weight: 800">Can</div></div>
    </div>
    <p class="govde" style="text-align: center; font-size: 13px">Herkesin puanı birazdan bu ekranda listelenir (4 ile aynı).</p>
    <div class="esnek"></div>
    <button class="dg bekle" disabled>Kuran kişi bekleniyor… <span class="cip" style="font-size: 13px">Murat ★</span></button>
  </section>
</template>

<template data-ad="6 · Final: kişisel kart (KK-69) · ödüller 10/10 ama ile aynı">
  <section class="ekran">
    <div class="ust"><span class="cip oda">ODA</span><div class="etiket">Final · senin kartın</div><span style="width: 44px"></span></div>
    <div class="orta esnek">
      <div class="kart" style="width: 100%; background: var(--marka); color: var(--kontur); transform: rotate(-2deg); text-align: left; padding: 20px; box-shadow: 8px 8px 0 var(--golge)">
        <div class="etiket" style="color: #3a3560">Deniz, bu odada ortalaman</div>
        <div style="font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">7,4</div>
        <div style="font-size: 18px; font-weight: 800">odanın ortalamasından 1,8 cömert</div>
        <div style="margin-top: 12px; display: flex; gap: 7px; flex-wrap: wrap">
          <span class="cip" style="background: var(--marka-2); color: var(--kontur)">Ruh ikizin: Mert</span>
          <span class="cip y">En yüksek: 10</span><span class="cip k">En düşük: 3</span><span class="cip" style="background: var(--zemin); color: var(--metin)">1 boş</span>
        </div>
      </div>
      <p class="govde" style="margin-top: 22px; font-size: 13px">Önce ödüller (En acımasız · Melek kalpli · Ruh ikizleri), sonra bu kart. Boşlar ve çıkanlar ödüllere girmez.</p>
    </div>
    <div style="display: flex; gap: 12px"><button class="dg" style="flex: 1; width: auto">Paylaş</button><button class="dg" style="flex: 1; width: auto; background: var(--yuzey); color: var(--metin)">Tekrar oyna</button></div>
  </section>
</template>

<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
  const [w, h] = (p.get('boy') || '375x667').split('x').map(Number);
  document.documentElement.dataset.tema = tema;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('baslik').textContent = `Kafadar — 10/10 ama oda modu · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;
  const kap = document.getElementById('ekranlar');
  document.querySelectorAll('template').forEach(t => {
    const f = document.createElement('figure'), c = document.createElement('figcaption');
    c.textContent = t.dataset.ad; f.append(c, t.content.cloneNode(true)); kap.append(f);
  });
</script>
</body>
</html>
