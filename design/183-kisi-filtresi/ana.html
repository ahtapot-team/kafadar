<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — kişi filtresi (ana ekran)</title>
<!-- #183 (PRD v7.1, KK-87…KK-89) · Ana ekran: kişi çipleri, rozetsiz oyun kartı, boş liste. Varyant yok; #171 A'nın devamı.
     Kullanım: ?tema=koyu|acik&boy=375x667. Tek dış kaynak: Google Fonts (yoksa system-ui). -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --w: 375px; --h: 667px; }
  [data-tema="koyu"] { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; max-width: var(--w); }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 16px; padding: 34px 22px 22px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .logo { align-self: flex-start; background: var(--marka); color: var(--kontur); border: 4px solid var(--kontur); border-radius: 20px; padding: 4px 16px 8px;
    box-shadow: 5px 5px 0 var(--golge); transform: rotate(-4deg); font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 6px; }
  .ayar { position: absolute; top: 34px; right: 22px; width: 48px; height: 48px; border-radius: 12px; border: 3px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-size: 20px; }
  .alt { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.45; color: var(--soluk); }
  /* Kişi çipleri: dördü tek satıra sığar (KK-87 "hep görünür"). İç boşluk bosluk.s, çipler satırı doldurur. */
  .cipler { display: flex; gap: 8px; padding-bottom: 5px; flex: none; }
  .cip { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 8px; border-radius: 12px; border: 3px solid var(--kontur);
    background: var(--yuzey); color: var(--metin); font-size: 16px; font-weight: 800; white-space: nowrap; }
  .cip.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); }
  .cip.bas { box-shadow: 1px 1px 0 var(--golge); transform: translate(3px, 3px); }
  /* Oyun kartı: bugünkü birincil düğme; tür rozeti yok, yalnız kişi sayısı (KK-89) */
  .liste { display: flex; flex-direction: column; gap: 16px; }
  .kart { background: var(--marka); color: var(--kontur); border: 4px solid var(--kontur); border-radius: 20px; padding: 12px 18px 14px; box-shadow: 5px 5px 0 var(--golge);
    display: flex; flex-direction: column; gap: 4px; }
  .kart .ad { font-size: 21px; font-weight: 800; line-height: 1.1; }
  .kisi { font-size: 17px; font-weight: 500; }
  /* Boş liste (KK-88) */
  .bos { border: 3px dashed var(--soluk); border-radius: 20px; padding: 28px 24px; text-align: center; font-size: 17px; font-weight: 500; line-height: 1.45; color: var(--soluk); }
  .ornek { position: absolute; left: 22px; right: 22px; bottom: 22px; font-size: 12px; font-weight: 700; color: var(--soluk); text-align: center; }
  /* Ölçü paneli */
  .olcu { gap: 12px; }
  .olcu h3 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--soluk); }
  .satir { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .not { font-size: 12px; font-weight: 700; color: var(--soluk); margin-top: 6px; }
  .olcu ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.42; font-weight: 500; }
  .olcu code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; }
  .eski { text-decoration: line-through; color: var(--soluk); }
</style>
</head>
<body>
<h1 id="baslik">Kafadar — kişi filtresi</h1>
<div id="ekranlar"></div>

<template data-ad="Ölçüler (KK-85, KK-87, KK-89)">
  <section class="ekran olcu">
    <h3>Kişi çipi</h3>
    <div class="satir">
      <div><span class="cip" style="flex:none">3–5 kişi</span><div class="not">seçili değil</div></div>
      <div><span class="cip sec" style="flex:none">✓ 2 kişi</span><div class="not">seçili</div></div>
      <div><span class="cip sec bas" style="flex:none">✓ 2 kişi</span><div class="not">basılı</div></div>
    </div>
    <ul>
      <li>#171 çipiyle aynı: <code>dokunmaAlani</code> 48, <code>cizgi.ince</code>, <code>yaricap.cip</code>, <code>yazi.cip</code>, seçili <code>marka2</code> + ✓ + 5px <code>golge</code></li>
      <li>Değişen: iç boşluk <span class="eski">bosluk.l</span> → <code>bosluk.s</code> 8, çipler satırı doldurur (<code>flexGrow: 1</code>). Dördü 375 genişlikte tek satıra sığar; 360'tan dar ekranda satır yatay kayar.</li>
      <li>Ekran okuyucu: “2 kişi, seçili, düğme”</li>
    </ul>
    <h3>Oyun kartı</h3>
    <div class="kart" style="padding: 10px 16px 12px"><div class="ad">Casus kim</div><div class="kisi">👥 3–12 kişi</div></div>
    <ul>
      <li>Tür rozeti kalktı; kişi sayısı <code>yazi.govde</code>, tanıtım kartındakiyle aynı metin</li>
    </ul>
    <h3>Boş liste</h3>
    <ul>
      <li>Kesik çizgili kutu: <code>cizgi.ince</code> <code>soluk</code>, <code>yaricap.dugme</code>, yazı <code>yazi.govde</code> <code>soluk</code>. Yeni token yok.</li>
    </ul>
  </section>
</template>

<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
  const [w, h] = (p.get('boy') || '375x667').split('x').map(Number);
  document.documentElement.dataset.tema = tema;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('baslik').textContent = `Kafadar — kişi filtresi · ana ekran · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;
  // Kayıt sırası (PRD v7.1): kişi aralığı minOyuncu…12
  const oyunlar = [
    { ad: 'OK mu NOK mu', min: 2 },
    { ad: '10/10 ama', min: 2 },
    { ad: 'Casus kim', min: 3 },
  ];
  // Çip kuralları: oyunun aralığı çipin aralığıyla kesişirse kalır (KK-88)
  const cipler = [['tumu', 'Tümü', 2, 12], ['iki', '2 kişi', 2, 2], ['orta', '3–5 kişi', 3, 5], ['cok', '6+ kişi', 6, 12]];
  const eslesir = (o, [, , a, b]) => o.min <= b && 12 >= a;
  const ekran = (secili, bos) => {
    const c = cipler.find(x => x[0] === secili);
    const liste = bos ? [] : oyunlar.filter(o => eslesir(o, c));
    return `<section class="ekran">
      <div class="logo">Kafadar</div><div class="ayar" aria-label="Ayarlar">⚙️</div>
      <p class="alt">Bir oyun seç, telefonu ele ver.</p>
      <div class="cipler" role="toolbar">${cipler.map(([k, ad]) => `<span class="cip${k === secili ? ' sec' : ''}" role="button" aria-pressed="${k === secili}">${k === secili ? '✓ ' : ''}${ad}</span>`).join('')}</div>
      <div class="liste">${liste.length ? liste.map(o => `<div class="kart" role="button"><div class="ad">${o.ad}</div><div class="kisi">👥 ${o.min}–12 kişi</div></div>`).join('')
        : '<div class="bos">Bu kişi sayısına uygun oyun henüz yok.</div>'}</div>
      ${bos ? '<div class="ornek">Örnek: bugün hiçbir çip boş kalmaz; ileride eşleşmeyen bir çip olursa böyle görünür.</div>' : ''}
    </section>`;
  };
  const kap = document.getElementById('ekranlar');
  const ekle = (ad, html) => { const f = document.createElement('figure'), c = document.createElement('figcaption'); c.textContent = ad; f.append(c); f.insertAdjacentHTML('beforeend', html); kap.append(f); };
  ekle('1 · Açılış: “Tümü” seçili, dört çip hep görünür (KK-87)', ekran('tumu'));
  ekle('2 · “2 kişi” seçili: Casus kim düşer (KK-88)', ekran('iki'));
  ekle('3 · Boş liste (KK-88)', ekran('cok', true));
  document.querySelectorAll('template[data-ad]').forEach(t => {
    const f = document.createElement('figure'), c = document.createElement('figcaption');
    c.textContent = '4 · ' + t.dataset.ad; f.append(c, t.content.cloneNode(true)); kap.append(f);
  });
</script>
</body>
</html>
