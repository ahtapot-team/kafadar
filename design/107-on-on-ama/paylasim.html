<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — 10/10 ama paylaşım görseli</title>
<!-- #107 KK-58: 9:16 (1080×1920). Puan renkleri: 0–3 kırmızı, 4–6 sarı, 7–10 yeşil. Tek dış kaynak: Google Fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; --kontur: #0B0920; --golge: #7C6CFF;
    --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .gorsel { width: 1080px; height: 1920px; margin: 0 auto; background: var(--zemin); color: var(--metin); padding: 120px 90px 100px;
    display: flex; flex-direction: column; gap: 56px; overflow: hidden; }
  .sticker { display: inline-block; transform: rotate(-4deg); border: 10px solid var(--kontur); border-radius: 44px; box-shadow: 14px 14px 0 var(--golge);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); white-space: nowrap; }
  .bar { display: grid; grid-template-columns: 200px 1fr 80px; gap: 24px; align-items: center; font-size: 46px; font-weight: 800; }
  .yol { height: 70px; border-radius: 26px; border: 8px solid var(--kontur); background: var(--yuzey); overflow: hidden; }
  .yol i { display: block; height: 100%; border-right: 8px solid var(--kontur); }
  .k { background: var(--nok); } .s { background: var(--marka); } .y { background: var(--ok); }
</style>
</head>
<body>
<div class="gorsel">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span class="sticker" style="background: var(--marka); font-size: 96px; padding: 16px 44px 26px">Kafadar!</span>
    <span class="sticker" style="background: var(--marka-2); font-size: 52px; padding: 14px 30px 20px; transform: rotate(3deg)">10/10 ama</span>
  </div>
  <div style="padding: 60px; border-radius: 70px; border: 10px solid var(--kontur); background: var(--marka); color: var(--kontur); box-shadow: 20px 20px 0 var(--golge); transform: rotate(-3deg)">
    <span style="display: inline-block; padding: 6px 26px 12px; border-radius: 30px; background: var(--kontur); color: var(--marka); font-size: 90px; font-weight: 800; transform: rotate(-3deg)">10/10</span>
    <div style="margin-top: 24px; font-size: 78px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08">ama her sabah 5'te kalkıp seni de kaldırıyor.</div>
  </div>
  <div style="display: flex; align-items: baseline; gap: 24px">
    <div style="font-size: 230px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.9">5,8</div>
    <div style="font-size: 64px; font-weight: 800; color: var(--soluk)">/10<br>yeni puan</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 22px">
    <div class="bar"><span>Can</span><span class="yol"><i class="y" style="width: 90%"></i></span><span>9</span></div>
    <div class="bar"><span>Deniz</span><span class="yol"><i class="y" style="width: 80%"></i></span><span>8</span></div>
    <div class="bar"><span>Mert</span><span class="yol"><i class="s" style="width: 60%"></i></span><span>6</span></div>
    <div class="bar"><span>Elif</span><span class="yol"><i class="s" style="width: 40%"></i></span><span>4</span></div>
    <div class="bar"><span>Ayşe</span><span class="yol"><i class="k" style="width: 20%"></i></span><span>2</span></div>
  </div>
  <div style="margin-top: auto; text-align: center; font-size: 40px; font-weight: 700; color: var(--soluk)">Kafadar ile oynandı · 10/10 ama</div>
</div>
</body>
</html>
