<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — Quiz Night</title>
<!-- #221 (PRD v9, KK-106…KK-115). Seçilen: C · Karma (Semih, Telegram 921): oyun ekranları A · Sade liste, sonuç ve paylaşım kartı B · Yarışma kartı. Grup/oda sonucu ve paylaşımı birinciyi gösterir (Semih, Telegram 925; PRD PR #245, KK-111/112/114). Elenen A/B şablonu: commit 842f826 (design/221-quiz-night/ekranlar.html?varyant=a|b), PNG'ler design/arsiv/221-quiz-night/.
     Kullanım: ?tema=koyu|acik  &bolum=tek|grup-oda (boşsa hepsi)  &boy=375x667  &panel=<kimlik> (tek panel, ör. uzun).
     Renk kuralı: ok/nok yalnızca doğru/yanlış; zorluk yazıyla; sayaç marka, kırmızı yok. Tek dış kaynak: Google Fonts.
     Örnek içerik (Aşk-ı Memnu) yalnızca yerleşim içindir; gerçek sorular #225'te kaynaklarıyla doğrulanır. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --kontur: #0B0920; --golge: #7C6CFF; --marka: #FFD23F; --marka-2: #5B8CFF; --ok: #3DDC84; --nok: #FF5A4E; --w: 375px; --h: 667px; }
  [data-tema="koyu"], .koyu { --zemin: #16123F; --yuzey: #2B2570; --metin: #FFF8E7; --soluk: #B9B3E8; }
  [data-tema="acik"] { --zemin: #FFF8E7; --yuzey: #FFFFFF; --metin: #16123F; --soluk: #5B5585; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #DCD9E8; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  body.tek-panel { padding: 8px; display: grid; place-items: center; min-height: 100vh; }
  h1 { margin: 0 0 24px; font-size: 22px; color: #2a2640; text-align: center; }
  #ekranlar { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { margin: 0; } figcaption { font-size: 14px; font-weight: 700; color: #4a4566; margin-bottom: 8px; max-width: var(--w); line-height: 1.35; }
  .ekran { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 28px; background: var(--zemin); color: var(--metin);
    display: flex; flex-direction: column; gap: 12px; padding: 34px 20px 22px; box-shadow: 0 16px 40px rgba(20,16,50,.22); }
  .esnek { flex: 1; min-height: 0; }
  .ust { display: flex; align-items: center; gap: 10px; flex: none; }
  .ust .orta { flex: 1; text-align: center; }
  .kare { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 3px solid var(--kontur); background: var(--yuzey); color: var(--metin);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .bilgi-i { width: 24px; height: 24px; border-radius: 50%; background: var(--marka); border: 3px solid var(--kontur); color: var(--kontur);
    display: inline-grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; }
  .bilgi-yazili { height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 9px; border-radius: 12px; border: 3px solid var(--kontur);
    background: var(--yuzey); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .etiket { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); }
  .govde { font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--soluk); margin: 0; }
  .baslik { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .dg { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 58px; border-radius: 20px; border: 4px solid var(--kontur);
    background: var(--marka); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); font: 800 19px 'Bricolage Grotesque', sans-serif; flex: none; padding: 6px 14px; }
  .dg small { font-size: 14px; font-weight: 500; }
  .dg.ikincil { background: var(--yuzey); color: var(--metin); }
  .dg.ikincil small { color: var(--soluk); }
  .dg.bekle { background: var(--yuzey); color: var(--soluk); border-style: dashed; box-shadow: none; font-size: 17px; }
  .dgler { display: flex; gap: 12px; flex: none; } .dgler .dg { flex: 1; width: auto; }
  .rozet { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 12px; border: 3px solid var(--kontur);
    background: var(--yuzey); color: var(--metin); font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; flex: none; }
  .rozet.m2 { background: var(--marka-2); color: var(--kontur); }
  .rozet.oda { background: var(--marka-2); color: var(--kontur); transform: rotate(2deg); }
  .sticker { display: inline-block; transform: rotate(-4deg); padding: 4px 14px 8px; border-radius: 16px; border: 4px solid var(--kontur);
    box-shadow: 5px 5px 0 var(--golge); font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--kontur); white-space: nowrap; }
  .tik { width: 20px; height: 20px; border-radius: 50%; background: var(--marka); border: 2px solid var(--kontur); display: inline-grid; place-items: center; color: var(--kontur); font-size: 11px; font-weight: 800; flex: none; }
  /* Ana ekran (#183 ile aynı) */
  .logo { align-self: flex-start; background: var(--marka); color: var(--kontur); border: 4px solid var(--kontur); border-radius: 20px; padding: 4px 16px 8px;
    box-shadow: 5px 5px 0 var(--golge); transform: rotate(-4deg); font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 6px; }
  .ayar { position: absolute; top: 34px; right: 22px; width: 48px; height: 48px; border-radius: 12px; border: 3px solid var(--kontur); background: var(--yuzey); display: grid; place-items: center; font-size: 20px; }
  .cipler { display: flex; gap: 8px; padding-bottom: 5px; flex: none; }
  .fcip { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 8px; border-radius: 12px; border: 3px solid var(--kontur);
    background: var(--yuzey); color: var(--metin); font-size: 16px; font-weight: 800; white-space: nowrap; }
  .fcip.sec { background: var(--marka-2); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); }
  .fcip.ok { background: var(--ok); color: var(--kontur); box-shadow: 5px 5px 0 var(--golge); }
  .oyun { background: var(--marka); color: var(--kontur); border: 4px solid var(--kontur); border-radius: 20px; padding: 12px 18px 14px; box-shadow: 5px 5px 0 var(--golge); flex: none; }
  .oyun b { display: block; font-size: 21px; line-height: 1.1; } .oyun span { font-size: 17px; font-weight: 500; }
  /* Paket: satır kartı */
  .pliste { display: flex; flex-direction: column; gap: 12px; }
  .paket { display: flex; gap: 12px; align-items: center; padding: 11px 14px 11px 11px; border-radius: 20px; border: 4px solid var(--kontur); background: var(--yuzey);
    box-shadow: 5px 5px 0 var(--golge); flex: none; }
  .emo { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid var(--kontur); display: grid; place-items: center; font-size: 26px; }
  .paket b { display: block; font-size: 17px; line-height: 1.2; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; font-weight: 700; color: var(--soluk); }
  .meta .rozet { height: 24px; font-size: 11px; padding: 0 7px; border-width: 2px; background: var(--zemin); }
  /* Soru metni: ≤90 karakter 22/28, fazlası 19/25 */
  .soru { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.27; letter-spacing: -0.01em; }
  .soru.uzun { font-size: 19px; line-height: 1.3; }
  /* Şık — A: tam genişlik satır */
  .siklar { display: flex; flex-direction: column; gap: 10px; }
  .sik { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px 8px 10px; border-radius: 20px; border: 4px solid var(--kontur);
    background: var(--yuzey); color: var(--metin); box-shadow: 5px 5px 0 var(--golge); font-size: 17px; font-weight: 700; line-height: 1.25; }
  .harf { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 3px solid var(--kontur); background: var(--zemin); color: var(--metin);
    display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  .sik .yazi { flex: 1; min-width: 0; }
  .isaret { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--kontur); display: grid; place-items: center; font-size: 16px; font-weight: 800; }
  .dogru { background: var(--ok); color: var(--kontur); } .dogru .isaret { color: var(--ok); }
  .yanlis { background: var(--nok); color: var(--kontur); } .yanlis .isaret { color: var(--nok); }
  .dogru .harf, .yanlis .harf, .senin .harf { background: #FFF8E7; color: var(--kontur); }
  .sonuk { opacity: .45; box-shadow: none; }
  .yari { opacity: .72; box-shadow: none; }
  .duz { box-shadow: none; }
  .senin { background: var(--marka-2); color: var(--kontur); }
  .senin .rozet { height: 24px; font-size: 11px; padding: 0 7px; border-width: 2px; background: var(--kontur); color: #FFF8E7; }
  .kimler { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .kimler span { height: 22px; padding: 0 7px; border-radius: 8px; border: 2px solid var(--kontur); background: #FFF8E7; color: var(--kontur); font-size: 11.5px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 3px; }
  .kimler span.ben { background: var(--kontur); color: #FFF8E7; }
  .kimler .yok { border-style: dashed; background: transparent; color: inherit; opacity: .8; }
  /* Sayaç (oda): ince çubuk, marka dolgu, kırmızı yok */
  .sure { display: flex; align-items: center; gap: 10px; flex: none; }
  .sure .yol { flex: 1; height: 12px; border-radius: 6px; border: 3px solid var(--kontur); background: var(--yuzey); overflow: hidden; }
  .sure .yol i { display: block; height: 100%; background: var(--marka); }
  .sure b { font-size: 15px; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .titre { display: inline-block; animation: none; }
  /* Sonuç */
  .puan { font-size: 104px; font-weight: 800; letter-spacing: -0.05em; line-height: .95; font-variant-numeric: tabular-nums; }
  .puan small { font-size: 42px; color: var(--soluk); letter-spacing: -0.02em; }
  .unvan { padding: 14px 18px 16px; border-radius: 24px; border: 4px solid var(--kontur); background: var(--marka); color: var(--kontur); box-shadow: 7px 7px 0 var(--golge);
    transform: rotate(-1.5deg); }
  .unvan .etiket { color: #3a3560; } .unvan b { display: block; font-size: 22px; line-height: 1.2; margin-top: 4px; }
  .kutular { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .kutular i { height: 28px; border-radius: 8px; border: 3px solid var(--kontur); display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; color: var(--kontur); }
  .bantlar { display: flex; flex-direction: column; gap: 7px; min-height: 0; overflow: hidden; }
  .bant { display: flex; flex-direction: column; gap: 3px; }
  .bant-u { font-size: 13px; font-weight: 700; color: var(--soluk); line-height: 1.3; padding: 0 2px 2px; }
  .bantlar .bant-u { align-self: flex-start; color: var(--kontur); background: var(--marka); border: 3px solid var(--kontur); border-radius: 12px; padding: 3px 10px 5px;
    transform: rotate(-1deg); margin: 0 0 2px 2px; box-shadow: 3px 3px 0 var(--golge); font-size: 12.5px; }
  .sira1 { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; height: 34px; padding: 0 12px 0 5px; border-radius: 14px;
    border: 3px solid var(--kontur); background: var(--yuzey); flex: none; }
  .sira1 .no { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--kontur); display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--zemin); color: var(--metin); }
  .sira1 .no.bir { background: var(--marka); color: var(--kontur); }
  .sira1 b { font-size: 15px; } .sira1 em { font-style: normal; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sira1.ben { background: var(--marka-2); color: var(--kontur); }
  /* Kim bildi */
  .bildi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .bildi .fcip { box-shadow: none; } .bildi .fcip.ok { box-shadow: 4px 4px 0 var(--golge); }
  .bekleyen { display: flex; flex-wrap: wrap; gap: 6px; }
  .bekleyen > span { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px 0 5px; border-radius: 12px; border: 3px solid var(--kontur); background: var(--yuzey); font-size: 13px; font-weight: 800; }
  .bekleyen > span.yok { border-style: dashed; padding-left: 9px; color: var(--soluk); background: transparent; border-color: var(--soluk); }
  /* Birinci kartı (grup/oda sonucu ve paylaşım): 🏆, ad(lar), puan, unvan */
  .birinci { position: relative; flex: none; margin-top: 8px; padding: 12px 16px 14px; border-radius: 24px; border: 4px solid var(--kontur); background: var(--marka); color: var(--kontur);
    box-shadow: 8px 8px 0 var(--golge); transform: rotate(-2deg); }
  .birinci .etiket { color: #3a3560; }
  .birinci .kupa { position: absolute; top: -20px; right: 12px; font-size: 42px; transform: rotate(10deg); }
  .birinci .ad { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 0; }
  .birinci .ad span { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .birinci .ad span.cok { font-size: 26px; }
  .birinci .ad i { font-style: normal; color: #3a3560; font-weight: 700; }
  .birinci .ad em { font-style: normal; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .birinci .ad em small { font-size: .55em; color: #3a3560; }
  .birinci b { display: block; font-size: 16px; line-height: 1.25; }
  .birinci.kucuk { padding: 10px 14px 12px; } .birinci.kucuk .kupa { font-size: 34px; top: -16px; }
  .birinci.kucuk .ad span { font-size: 26px; } .birinci.kucuk .ad em { font-size: 24px; } .birinci.kucuk b { font-size: 14px; }
  .birinci.buyuk { padding: 22px 20px 22px; transform: rotate(-3deg); box-shadow: 9px 9px 0 var(--golge); }
  .birinci.buyuk .kupa { font-size: 66px; top: -38px; right: 8px; }
  .birinci.buyuk .ad { flex-direction: column; align-items: flex-start; gap: 0; margin: 6px 0 4px; }
  .birinci.buyuk .ad span { font-size: 48px; } .birinci.buyuk .ad em { font-size: 96px; letter-spacing: -0.05em; line-height: 1; }
  .birinci.buyuk b { font-size: 22px; margin-top: 4px; }
  /* Diyalog */
  .perde { position: absolute; inset: 0; background: rgba(11,9,32,.7); display: flex; align-items: center; padding: 20px; }
  .diyalog { width: 100%; padding: 20px 18px 18px; border-radius: 30px; border: 4px solid var(--kontur); background: var(--yuzey); box-shadow: 8px 8px 0 var(--golge); display: flex; flex-direction: column; gap: 12px; }
  .diyalog h3 { margin: 0; font-size: 24px; line-height: 1.1; }
  .diyalog .m { font-size: 15px; font-weight: 600; line-height: 1.4; } .diyalog .m b { display: block; font-size: 16px; }
  /* Paylaşım kartı (9:16, 1080×1920'nin ölçekli görünümü; her zaman koyu) */
  .paylas { padding: 30px 24px 22px; gap: 16px; border-radius: 0; }
  /* Ölçü paneli */
  .olcu { gap: 7px; }
  .olcu h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--soluk); }
  .olcu ul { margin: 0; padding-left: 17px; font-size: 12px; line-height: 1.32; font-weight: 500; }
  .olcu code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<h1 id="baslik">Kafadar — Quiz Night</h1>
<div id="ekranlar"></div>
<script>
const p = new URLSearchParams(location.search);
const tema = p.get('tema') === 'acik' ? 'acik' : 'koyu';
const bolum = p.get('bolum') || 'hepsi';
const tekPanel = p.get('panel');
const [w, h] = (p.get('boy') || '375x667').split('x').map(Number);
document.documentElement.dataset.tema = tema;
document.documentElement.style.setProperty('--w', w + 'px');
document.documentElement.style.setProperty('--h', h + 'px');
document.getElementById('baslik').textContent =
  `Kafadar — Quiz Night · C · Karma · ${{ tek: 'Tek başına', 'grup-oda': 'Grup ve oda', hepsi: 'Tüm ekranlar' }[bolum]} · ${tema === 'koyu' ? 'Koyu' : 'Açık'} · ${w}×${h}`;

// ---------- Örnek içerik (yerleşim için; doğrulama #225) ----------
const PAKETLER = [
  { ad: 'Aşk-ı Memnu', e: '💔', k: 'Türk' }, { ad: 'Friends', e: '☕', k: 'Yabancı' },
  { ad: 'Leyla ile Mecnun', e: '🌙', k: 'Türk' }, { ad: 'Breaking Bad', e: '🧪', k: 'Yabancı' },
  { ad: 'Deli Yürek', e: '🦅', k: 'Türk' }, { ad: 'Yüzüklerin Efendisi', e: '💍', k: 'Yabancı' },
];
const UNVAN = {
  dusuk: 'Yalının kapısından bile içeri girememişsin.',     // 0–3
  orta: 'Nihal gibi her şeyi en son sen öğreniyorsun.',     // 4–6
  iyi: 'Firdevs Hanım seni beş çayına davet etti.',         // 7–9
  tam: 'Beşir bile yalının sırlarını senden öğreniyor.',    // 10
};
const unvan = (n) => n <= 3 ? UNVAN.dusuk : n <= 6 ? UNVAN.orta : n <= 9 ? UNVAN.iyi : UNVAN.tam;
const S = {
  kanal: { no: 3, z: 'Kolay', m: 'Aşk-ı Memnu ilk olarak hangi televizyon kanalında yayınlandı?', s: ['ATV', 'Kanal D', 'Show TV', 'Star TV'], d: 1 },
  sezon: { no: 4, z: 'Orta', m: 'Aşk-ı Memnu toplam kaç sezon sürdü?', s: ['1 sezon', '2 sezon', '3 sezon', '4 sezon'], d: 1 },
  final: { no: 5, z: 'Orta', m: 'Dizinin final bölümü hangi yıl yayınlandı?', s: ['2009', '2011', '2010', '2008'], d: 2 },
  soyad: { no: 6, z: 'Orta', m: 'Bihter, Adnan Bey ile evlenmeden önce hangi soyadını taşıyordu?', s: ['Haznedar', 'Yöreoğlu', 'Ziyagil', 'Karaca'], d: 1 },
  // En uzun örnek: metin tam 140, şıklar 39–40 karakter (KK-115 sınırı)
  uzun: { no: 8, z: 'Zor', m: "Halit Ziya Uşaklıgil'in Aşk-ı Memnu romanı, kitap olarak basılmadan önce, ilk kez hangi dergide ve hangi yıllar arasında tefrika edilmiştir?",
    s: ['Resimli Kitap dergisinde, 1908 ile 1909', 'Servet-i Fünun dergisinde, 1899 ile 1900', 'İkdam gazetesinde, 1902 ile 1903 yılları', 'Malûmat dergisinde, 1896 ile 1897'], d: 1 },
};
const HARF = ['A', 'B', 'C', 'D'];

// ---------- Parçalar ----------
const bilgiKisa = '<span class="kare" aria-label="Nasıl oynanır"><span class="bilgi-i">i</span></span>';
const bilgiYazili = '<span class="bilgi-yazili"><span class="bilgi-i">i</span>Nasıl oynanır</span>';
const geri = '<span class="kare" aria-label="Geri">‹</span>';
const cik = '<span class="kare" aria-label="Oyundan çık">✕</span>';
const zorluk = (z) => `<span class="rozet">${z === 'Kolay' ? '●○○' : z === 'Orta' ? '●●○' : '●●●'}&nbsp;${z}</span>`;

// Oyun içi üst çubuk: ✕ · orta etiket · sağ rozet · ⓘ (mevcut UstCubuk)
const ustOyun = (q, { oda = false, kuran = false } = {}) =>
  `<div class="ust">${cik}<span class="orta etiket">${oda ? `<span class="rozet oda">ODA${kuran ? ' ★' : ''}</span>` : 'Aşk-ı Memnu'}</span><span class="rozet m2">${q.no}/10</span>${bilgiKisa}</div>`;

// Soru gövdesi: zorluk rozeti + metin + satır şıklar
// durum: her şık için '', 'dogru', 'yanlis', 'sonuk', 'yari', 'duz', 'senin'; ek: şık içi ek HTML (kimler)
const soruGovde = (q, durum = [], ek = [], { rozetUst = true } = {}) => {
  const uzun = q.m.length > 90 ? ' uzun' : '';
  const sik = (s, i) => {
    const c = durum[i] || '';
    const isaret = c.includes('dogru') ? '<span class="isaret" aria-hidden="true">✓</span>' : c.includes('yanlis') ? '<span class="isaret" aria-hidden="true">✕</span>' : '';
    const senin = c.includes('senin') ? '<span class="rozet">Senin</span>' : '';
    return `<div class="sik ${c}" role="button"><span class="harf">${HARF[i]}</span><span class="yazi">${s}${ek[i] || ''}</span>${isaret}${senin}</div>`;
  };

  return `<div class="bantlar">${bantlar.map(b => `<div class="bant"><div class="bant-u">“${b.u}”</div>${b.l.map(([no, ad, pu]) =>

};
