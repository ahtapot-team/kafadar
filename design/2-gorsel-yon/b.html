<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafadar — B · Çıkartma</title>
<!-- Tek dış kaynak: Google Fonts (uygulamada font paketlenecek) -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E7F0;font-family:system-ui,sans-serif;padding:32px 16px}
h1{margin:0 0 8px;font-size:20px;color:#2a2640;text-align:center}
p.not{margin:0 0 20px;font-size:14px;color:#4a4566;text-align:center}
.sahne{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start}

</style>
</head>
<body>
<h1>Kafadar — B · Çıkartma</h1>
<p class="not">OK = yeşil (onay) · NOK = kırmızı (ret) · marka rengi nötr, oy rengiyle karışmaz</p>
<div class="sahne">
<figure><div style="width: 520px; height: 844px; box-sizing: border-box; padding: 48px 40px; background: #16123F; color: #FFF8E7; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; align-items: center; gap: 22px; padding: 8px 0 0 8px">
    <div style="transform: rotate(-6deg); padding: 10px 22px 14px; border-radius: 22px; background: #FFD23F; color: #0B0920; border: 4px solid #0B0920; box-shadow: 7px 7px 0 #7C6CFF; font-weight: 800; font-size: 54px; letter-spacing: -0.03em; line-height: 1">Kafadar!</div>
    <div style="transform: rotate(8deg); width: 64px; height: 64px; border-radius: 50%; background: #5B8CFF; border: 4px solid #0B0920; box-shadow: 5px 5px 0 #7C6CFF; display: flex; align-items: center; justify-content: center; gap: 8px">
      <div style="width: 10px; height: 14px; border-radius: 99px; background: #0B0920"></div>
      <div style="width: 10px; height: 14px; border-radius: 99px; background: #0B0920"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; color: #B9B3E8">RENK</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 72px; border-radius: 16px; background: #16123F; border: 3px solid #0B0920; box-shadow: 4px 4px 0 #2B2570"></div><div style="font-size: 13px; font-weight: 800">Zemin</div><div style="font-size: 11px; color: #B9B3E8">#16123F</div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 72px; border-radius: 16px; background: #2B2570; border: 3px solid #0B0920"></div><div style="font-size: 13px; font-weight: 800">Yüzey</div><div style="font-size: 11px; color: #B9B3E8">#2B2570</div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 72px; border-radius: 16px; background: #3DDC84; border: 3px solid #0B0920"></div><div style="font-size: 13px; font-weight: 800">OK · Yeşil</div><div style="font-size: 11px; color: #B9B3E8">#3DDC84</div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 72px; border-radius: 16px; background: #FF5A4E; border: 3px solid #0B0920"></div><div style="font-size: 13px; font-weight: 800">NOK · Kırmızı</div><div style="font-size: 11px; color: #B9B3E8">#FF5A4E</div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 72px; border-radius: 16px; background: #FFD23F; border: 3px solid #0B0920"></div><div style="font-size: 13px; font-weight: 800">Marka · Sarı</div><div style="font-size: 11px; color: #B9B3E8">#FFD23F</div></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; color: #B9B3E8">YAZI</div>
    <div style="font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.03em">OK mu <span style="color: #FF5A4E">NOK</span> mu?</div>
    <div style="font-size: 14px; color: #B9B3E8">Bricolage Grotesque ExtraBold · başlık, kart</div>
    <div style="font-size: 19px; font-weight: 500; line-height: 1.45">Herkes başparmağını gösterir, telefon sonucu söyler.</div>
    <div style="font-size: 14px; color: #B9B3E8">Bricolage Grotesque Medium · gövde</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; color: #B9B3E8">OY</div>
    <div style="display: flex; gap: 16px">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 20px; background: #3DDC84; color: #0B0920; border: 4px solid #0B0920; box-shadow: 5px 5px 0 #7C6CFF; font-weight: 800; font-size: 24px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>OK
      </div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 20px; background: #FF5A4E; color: #0B0920; border: 4px solid #0B0920; box-shadow: 5px 5px 0 #7C6CFF; font-weight: 800; font-size: 24px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(180deg)"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>NOK
      </div>
    </div>
  </div>
</div></figure>
<figure><div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 22px 36px; background: #16123F; color: #FFF8E7; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Oyundan çık" style="width: 48px; height: 48px; border-radius: 16px; border: 3px solid #0B0920; background: #2B2570; color: #FFF8E7; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
    <div style="font-weight: 800; font-size: 18px">Kart 4 <span style="color: #B9B3E8">/ 20</span></div>
    <div style="transform: rotate(3deg); height: 34px; padding: 0 14px; border-radius: 12px; border: 3px solid #0B0920; background: #7C6CFF; color: #0B0920; font-size: 15px; font-weight: 800; display: flex; align-items: center">Arkadaş</div>
  </div>

  <div style="position: relative; margin-top: 30px; height: 400px">
    <div style="position: absolute; inset: 18px -6px -14px 10px; border-radius: 30px; background: #5B8CFF; border: 4px solid #0B0920; transform: rotate(5deg)"></div>
    <div style="position: absolute; inset: 0; padding: 30px 26px; box-sizing: border-box; border-radius: 30px; background: #FFD23F; color: #0B0920; border: 4px solid #0B0920; box-shadow: 8px 8px 0 #7C6CFF; transform: rotate(-3deg); display: flex; flex-direction: column; justify-content: space-between">
      <div style="align-self: flex-start; padding: 6px 12px; border-radius: 10px; background: #0B0920; color: #FFD23F; font-size: 14px; font-weight: 800; letter-spacing: 0.06em">DURUM</div>
      <div style="font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -0.025em">Doğum gününü unutup “sürprizin yarın” demek.</div>
      <div style="font-size: 17px; font-weight: 700">OK mu, NOK mu?</div>
    </div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px">
    <div style="width: 64px; height: 64px; border-radius: 50%; border: 4px solid #2B2570; color: #5D569E; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center">3</div>
    <div style="transform: rotate(-6deg); width: 112px; height: 112px; border-radius: 50%; background: #FFF8E7; color: #0B0920; border: 4px solid #0B0920; box-shadow: 6px 6px 0 #7C6CFF; font-weight: 800; font-size: 68px; display: flex; align-items: center; justify-content: center">2</div>
    <div style="width: 64px; height: 64px; border-radius: 50%; border: 4px solid #2B2570; color: #5D569E; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center">1</div>
  </div>
  <div style="text-align: center; font-size: 19px; font-weight: 700; color: #B9B3E8">Başparmaklar hazır!</div>
</div></figure>
<figure><div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 22px 36px; background: #16123F; color: #FFF8E7; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px">
  <div style="font-size: 16px; font-weight: 600; color: #B9B3E8; line-height: 1.4">“Doğum gününü unutup ‘sürprizin yarın’ demek.”</div>

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
    <div style="transform: rotate(-4deg); padding: 6px 18px 10px; border-radius: 18px; background: #FF5A4E; color: #0B0920; border: 4px solid #0B0920; box-shadow: 6px 6px 0 #7C6CFF; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; line-height: 1">Ayşe</div>
    <div style="font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1.05">tek başına NOK!</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 22px">
        <div style="display: flex; align-items: center; gap: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>OK</div>
        <div style="color: #3DDC84">4</div>
      </div>
      <div style="height: 56px; border-radius: 18px; border: 4px solid #0B0920; background: #2B2570; overflow: hidden"><div style="width: 80%; height: 100%; background: #3DDC84; border-right: 4px solid #0B0920"></div></div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="padding: 6px 12px; border-radius: 12px; background: #3DDC84; color: #0B0920; border: 3px solid #0B0920; font-weight: 800; font-size: 16px">Mert</div>
        <div style="padding: 6px 12px; border-radius: 12px; background: #3DDC84; color: #0B0920; border: 3px solid #0B0920; font-weight: 800; font-size: 16px">Deniz</div>
        <div style="padding: 6px 12px; border-radius: 12px; background: #3DDC84; color: #0B0920; border: 3px solid #0B0920; font-weight: 800; font-size: 16px">Can</div>
        <div style="padding: 6px 12px; border-radius: 12px; background: #3DDC84; color: #0B0920; border: 3px solid #0B0920; font-weight: 800; font-size: 16px">Elif</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 22px">
        <div style="display: flex; align-items: center; gap: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF5A4E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(180deg)"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>NOK</div>
        <div style="color: #FF5A4E">1</div>
      </div>
      <div style="height: 56px; border-radius: 18px; border: 4px solid #0B0920; background: #2B2570; overflow: hidden"><div style="width: 20%; height: 100%; background: #FF5A4E; border-right: 4px solid #0B0920"></div></div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="transform: rotate(-4deg); padding: 6px 12px; border-radius: 12px; background: #FF5A4E; color: #0B0920; border: 3px solid #0B0920; font-weight: 800; font-size: 16px">Ayşe</div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 14px">
    <button style="flex: 1; height: 62px; border-radius: 20px; border: 4px solid #0B0920; background: #FFD23F; color: #0B0920; box-shadow: 5px 5px 0 #7C6CFF; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px">Sonraki kart</button>
    <button aria-label="Paylaş" style="width: 62px; height: 62px; border-radius: 20px; border: 4px solid #0B0920; background: #FFF8E7; color: #0B0920; box-shadow: 5px 5px 0 #7C6CFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
    </button>
  </div>
</div></figure>
</div>
