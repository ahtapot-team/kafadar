<!doctype html>
<meta charset="utf-8" />
<title>Kafadar</title>
<script>
  // Derin bağlantı yenilemesi: ana sayfaya ?p=<yol> ile yönlendir; index.html yolu geri yükler.
  var taban = location.pathname.match(/^\/[^/]+(\/pr\/\d+)?/)[0];
  var yol =
    location.pathname.slice(taban.length) + location.search + location.hash;
  location.replace(taban + '/?p=' + encodeURIComponent(yol));
</script>
