# Her PR için EAS Update yayınlar; Expo Go ile açılan QR ve linki PR'a yorum olarak yazar (KK-23).
# Gerekli repo secret'ı: EXPO_TOKEN. Ayrıca app.json'da EAS projectId ve updates.url olmalı (README).
name: Önizleme

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - 'content/**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - 'content/**/*.md'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: onizleme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_ODA_SUNUCU: wss://kafadar-oda.kafadar.workers.dev/ws # oda modu sunucusu (herkese açık adres)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Token yoksa önizleme atlanır
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN tanımlı değil, önizleme atlandı."

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - uses: expo/expo-github-action/preview@v8
        if: env.EXPO_TOKEN != '' && github.event_name == 'pull_request'
        with:
          command: eas update --auto

      # main'e her push'ta son main yayınlanır: kalıcı Expo Go linki README'de.
      - name: main için EAS Update
        if: env.EXPO_TOKEN != '' && github.event_name == 'push'
        run: eas update --channel main --message "main ${GITHUB_SHA::7}" --non-interactive
